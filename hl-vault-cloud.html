<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HL Vault — HIL System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="./hil-shell.js"></script>

  <style>
    /* ── LAYOUT UTILITIES (Shell doesn't provide these) ── */
    .hil-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .hil-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hil-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .hil-grid-2, .hil-grid-3 { grid-template-columns: 1fr; }
    }

    .hil-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .hil-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--hil-text-muted);
    }

    .hil-input, .hil-select, .hil-textarea {
      background: var(--hil-bg);
      border: 1px solid var(--hil-border);
      color: var(--hil-text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 9px 11px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .hil-input:focus, .hil-select:focus, .hil-textarea:focus {
      border-color: var(--hil-green);
    }
    .hil-select { cursor: pointer; }
    .hil-textarea { resize: vertical; min-height: 72px; }

    /* Buttons */
    .hil-btn {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 2px;
      padding: 9px 18px;
      border: 1px solid var(--hil-border);
      background: var(--hil-surface-2);
      color: var(--hil-text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .hil-btn:hover { border-color: var(--hil-text-muted); }
    .hil-btn.primary {
      background: var(--hil-green);
      color: #000;
      border-color: var(--hil-green);
    }
    .hil-btn.primary:hover { background: var(--hil-green-dim); }
    .hil-btn.danger {
      border-color: var(--hil-danger);
      color: var(--hil-danger);
    }
    .hil-btn.danger:hover { background: rgba(204,51,51,0.1); }
    .hil-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Badges */
    .hil-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 2px;
      display: inline-block;
    }
    .hil-badge.green  { background: rgba(0,204,102,0.15); color: var(--hil-green); border: 1px solid var(--hil-green); }
    .hil-badge.amber  { background: rgba(204,136,0,0.15); color: var(--hil-warning); border: 1px solid var(--hil-warning); }
    .hil-badge.red    { background: rgba(204,51,51,0.15); color: var(--hil-danger); border: 1px solid var(--hil-danger); }
    .hil-badge.gray   { background: var(--hil-surface-2); color: var(--hil-text-muted); border: 1px solid var(--hil-border); }

    /* Section label */
    .hil-section-label {
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--hil-text-muted);
      border-bottom: 1px solid var(--hil-border);
      padding-bottom: 6px;
      margin-bottom: 10px;
      margin-top: 4px;
    }

    /* Empty state */
    .hil-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--hil-text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    .hil-empty-icon { font-size: 32px; margin-bottom: 12px; }

    /* ── MODAL ── */
    .hil-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1500;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .hil-modal-overlay.open { display: flex; }

    .hil-modal {
      background: var(--hil-surface);
      border: 1px solid var(--hil-border);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .hil-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--hil-border);
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--hil-text-muted);
      flex-shrink: 0;
    }

    .hil-modal-close {
      background: none;
      border: none;
      color: var(--hil-text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
    }
    .hil-modal-close:hover { color: var(--hil-danger); }

    .hil-modal-body {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
    }

    .hil-modal-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--hil-border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* Address chip */
    .hil-address-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--hil-green);
      letter-spacing: 2px;
    }

    /* ── VAULT-SPECIFIC ── */
    .vault-tabs {
      display: flex;
      border-bottom: 1px solid var(--hil-border);
      margin-bottom: 20px;
    }
    .vault-tab {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 10px 18px;
      color: var(--hil-text-muted);
      cursor: pointer;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      transition: color 0.1s, border-color 0.1s;
    }
    .vault-tab:hover { color: var(--hil-text); }
    .vault-tab.active { color: var(--hil-green); border-bottom-color: var(--hil-green); }

    .vault-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .vault-toolbar .hil-input { flex: 1; min-width: 180px; max-width: 300px; }
    .vault-toolbar-right { margin-left: auto; display: flex; gap: 8px; }

    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border: 1px solid var(--hil-border);
      color: var(--hil-text-muted);
      cursor: pointer;
      background: none;
      border-radius: 2px;
      transition: all 0.1s;
    }
    .filter-chip:hover { border-color: var(--hil-text-muted); color: var(--hil-text); }
    .filter-chip.active { border-color: var(--hil-green); color: var(--hil-green); background: rgba(0,204,102,0.08); }

    /* Stats */
    .vault-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) { .vault-stats { grid-template-columns: 1fr 1fr; } }
    .stat-card {
      background: var(--hil-surface);
      border: 1px solid var(--hil-border);
      padding: 14px 16px;
    }
    .stat-val {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--hil-green);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--hil-text-muted);
    }

    /* Item rows */
    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      gap: 12px;
      align-items: center;
      background: var(--hil-surface);
      border: 1px solid var(--hil-border);
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }
    .item-row:hover { border-color: var(--hil-green-dim, #009944); background: var(--hil-surface-2); }

    .item-thumb {
      width: 48px; height: 48px;
      background: var(--hil-surface-2);
      border: 1px solid var(--hil-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .item-info { min-width: 0; }
    .item-name {
      font-size: 14px;
      color: var(--hil-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
      font-family: var(--font-ui);
    }
    .item-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .item-address { font-family: var(--font-mono); font-size: 10px; color: var(--hil-green); letter-spacing: 0.06em; }
    .item-category { font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); letter-spacing: 0.06em; }

    .item-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--hil-text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      transition: color 0.1s;
    }
    .icon-btn:hover { color: var(--hil-green); }

    /* Kit grid */
    .kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .kit-card {
      background: var(--hil-surface);
      border: 1px solid var(--hil-border);
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.1s;
    }
    .kit-card:hover { border-color: var(--hil-green-dim, #009944); }
    .kit-id { font-family: var(--font-mono); font-size: 10px; color: var(--hil-green); letter-spacing: 0.08em; margin-bottom: 4px; }
    .kit-name { font-size: 15px; color: var(--hil-text); margin-bottom: 8px; font-family: var(--font-ui); }
    .kit-meta { font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); letter-spacing: 0.06em; }
    .kit-status-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }

    /* Detail modal */
    .detail-hero {
      width: 100%; height: 180px;
      background: var(--hil-surface-2);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      overflow: hidden;
    }
    .detail-hero img { width: 100%; height: 100%; object-fit: cover; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 0;
      border-bottom: 1px solid var(--hil-border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; color: var(--hil-text-muted); flex-shrink: 0; padding-right: 16px; padding-top: 1px; }
    .detail-val { color: var(--hil-text); text-align: right; }
  </style>
</head>
<body>

<div class="hil-container">

  <!-- Stats -->
  <div class="vault-stats">
    <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-label">TOTAL ITEMS</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-active">—</div><div class="stat-label">ACTIVE</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-kits">—</div><div class="stat-label">KITS</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-value">—</div><div class="stat-label">EST. VALUE</div></div>
  </div>

  <!-- Tabs -->
  <div class="vault-tabs">
    <button class="vault-tab active" data-tab="items">ITEMS</button>
    <button class="vault-tab" data-tab="kits">KITS</button>
    <button class="vault-tab" data-tab="vessels">VESSELS</button>
  </div>

  <!-- ITEMS TAB -->
  <div id="tab-items">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="search-input" placeholder="Search name, address, category…">
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-item-btn">+ ADD ITEM</button>
      </div>
    </div>
    <div class="filter-chips" id="category-filters">
      <button class="filter-chip active" data-cat="">ALL</button>
      <button class="filter-chip" data-cat="tool">TOOL</button>
      <button class="filter-chip" data-cat="collectible">COLLECTIBLE</button>
      <button class="filter-chip" data-cat="heirloom">HEIRLOOM</button>
      <button class="filter-chip" data-cat="ephemera">EPHEMERA</button>
      <button class="filter-chip" data-cat="other">OTHER</button>
    </div>
    <div class="item-list" id="item-list">
      <div class="hil-empty"><div class="hil-empty-icon">🗄</div>Loading inventory…</div>
    </div>
  </div>

  <!-- KITS TAB -->
  <div id="tab-kits" style="display:none">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="kit-search" placeholder="Search kits…">
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-kit-btn">+ ADD KIT</button>
      </div>
    </div>
    <div class="kit-grid" id="kit-grid">
      <div class="hil-empty"><div class="hil-empty-icon">🧰</div>No kits yet.</div>
    </div>
  </div>

  <!-- VESSELS TAB -->
  <div id="tab-vessels" style="display:none">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="vessel-search" placeholder="Search vessels…">
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-vessel-btn">+ ADD VESSEL</button>
      </div>
    </div>
    <div class="item-list" id="vessel-list">
      <div class="hil-empty"><div class="hil-empty-icon">📦</div>No vessels yet.</div>
    </div>
  </div>

</div>

<!-- ── ITEM DETAIL MODAL ── -->
<div class="hil-modal-overlay" id="detail-modal">
  <div class="hil-modal" style="max-width:580px">
    <div class="hil-modal-header">
      <span id="detail-modal-title">ITEM DETAIL</span>
      <button class="hil-modal-close" data-close="detail-modal">✕</button>
    </div>
    <div class="hil-modal-body" id="detail-modal-body"></div>
    <div class="hil-modal-footer">
      <button class="hil-btn danger" id="detail-delete-btn">DELETE</button>
      <button class="hil-btn" id="detail-edit-btn">EDIT</button>
      <button class="hil-btn" data-close="detail-modal">CLOSE</button>
    </div>
  </div>
</div>

<!-- ── ADD / EDIT ITEM MODAL ── -->
<div class="hil-modal-overlay" id="item-modal">
  <div class="hil-modal" style="max-width:680px">
    <div class="hil-modal-header">
      <span id="item-modal-title">ADD ITEM</span>
      <button class="hil-modal-close" data-close="item-modal">✕</button>
    </div>
    <div class="hil-modal-body">
      <input type="hidden" id="edit-item-id">

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">DISPLAY NAME *</label>
          <input class="hil-input" id="f-display-name" placeholder="Champion Hand Crank Grinder">
        </div>
        <div class="hil-field">
          <label class="hil-label">HL ADDRESS</label>
          <input class="hil-input" id="f-hl-address" placeholder="SH-MM-S3-A1">
        </div>
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">CATEGORY</label>
          <select class="hil-select" id="f-category">
            <option value="tool">Tool</option>
            <option value="collectible">Collectible</option>
            <option value="heirloom">Heirloom</option>
            <option value="ephemera">Ephemera</option>
            <option value="media">Media</option>
            <option value="artwork">Artwork</option>
            <option value="document">Document</option>
            <option value="specimen">Specimen</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="hil-field">
          <label class="hil-label">STATUS</label>
          <select class="hil-select" id="f-status">
            <option value="active">Active</option>
            <option value="transferred">Transferred</option>
            <option value="donated">Donated</option>
            <option value="passed_on">Passed On</option>
            <option value="lost">Lost</option>
          </select>
        </div>
      </div>

      <div class="hil-grid-3">
        <div class="hil-field">
          <label class="hil-label">MANUFACTURER</label>
          <input class="hil-input" id="f-manufacturer" placeholder="Champion">
        </div>
        <div class="hil-field">
          <label class="hil-label">YEAR MADE</label>
          <input class="hil-input" id="f-year-made" placeholder="c.1920s">
        </div>
        <div class="hil-field">
          <label class="hil-label">CONDITION</label>
          <select class="hil-select" id="f-condition">
            <option value="unknown">Unknown</option>
            <option value="mint">Mint</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>
      </div>

      <div class="hil-field">
        <label class="hil-label">DESCRIPTION</label>
        <textarea class="hil-textarea" id="f-description" rows="2" placeholder="Short — one or two sentences."></textarea>
      </div>

      <div class="hil-field">
        <label class="hil-label">PROVENANCE</label>
        <textarea class="hil-textarea" id="f-provenance" rows="2" placeholder="Origin, previous owners, how it arrived."></textarea>
      </div>

      <div class="hil-field">
        <label class="hil-label">NARRATIVE</label>
        <textarea class="hil-textarea" id="f-narrative" rows="3" placeholder="The full story. No limit."></textarea>
      </div>

      <div class="hil-section-label">FINANCIAL</div>
      <div class="hil-grid-3">
        <div class="hil-field">
          <label class="hil-label">PURCHASE PRICE ($)</label>
          <input class="hil-input" type="number" id="f-purchase-price" placeholder="0.00">
        </div>
        <div class="hil-field">
          <label class="hil-label">CURRENT VALUE ($)</label>
          <input class="hil-input" type="number" id="f-current-value" placeholder="0.00">
        </div>
        <div class="hil-field">
          <label class="hil-label">PURCHASE SOURCE</label>
          <input class="hil-input" id="f-purchase-source" placeholder="Estate sale">
        </div>
      </div>

      <div class="hil-section-label">KIT MEMBERSHIPS</div>
      <div class="hil-field">
        <label class="hil-label">KIT IDs (comma-separated)</label>
        <input class="hil-input" id="f-kit-memberships" placeholder="TK-REPAIR-SCREEN, TK-WORKSHOP-BASIC">
      </div>

      <div class="hil-section-label">HERO PHOTO</div>
      <div class="hil-field">
        <div id="photo-preview" style="display:none;margin-bottom:10px">
          <img id="photo-preview-img" src="" alt=""
               style="width:100%;max-height:180px;object-fit:cover;border:1px solid var(--hil-border)">
          <button type="button" id="photo-remove-btn"
                  style="font-family:var(--font-mono);font-size:10px;color:var(--hil-danger);
                         background:none;border:none;cursor:pointer;margin-top:4px;padding:0">
            ✕ REMOVE PHOTO
          </button>
        </div>
        <label class="hil-btn" for="photo-file-input"
               style="display:inline-block;cursor:pointer;text-align:center;width:100%;box-sizing:border-box">
          📷 CHOOSE PHOTO
        </label>
        <input type="file" id="photo-file-input" accept="image/*"
               style="display:none">
        <div id="photo-upload-status"
             style="font-family:var(--font-mono);font-size:10px;
                    color:var(--hil-text-muted);margin-top:6px;min-height:16px"></div>
        <input type="hidden" id="f-hero-photo">
      </div>

      <div class="hil-section-label">DISPLAY FLAGS</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-vault" checked> VAULT
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-wunderkammer"> MUSEUM
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-history-wall"> HISTORY WALL
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-exchange"> EXCHANGE
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-family-ledger"> FAMILY LEDGER
        </label>
      </div>
    </div>
    <div class="hil-modal-footer">
      <button class="hil-btn" data-close="item-modal">CANCEL</button>
      <button class="hil-btn primary" id="save-item-btn">SAVE ITEM</button>

<!-- ── VAULT SCRIPT — modular SDK v10 via dynamic import ── -->
<script>
// Pre-register globals to prevent setMode-class errors
window.openModal  = () => {};
window.closeModal = () => {};

// State
let allItems = [], allKits = [], allVessels = [];
let activeTab = 'items', activeCat = '', searchQuery = '';
let editingItemId = null, editingKitId = null, editingVesselId = null;
let detailItem = null;

// Firebase modular SDK functions — populated after Shell loads Firebase
let _collection, _doc, _addDoc, _updateDoc, _deleteDoc,
    _onSnapshot, _serverTimestamp, _query, _orderBy;

// ── Shell init ──
HILShell.init({
  toolId:      'vault',
  toolName:    'HL Vault',
  requireAuth: true,
  onAuth:      handleAuth,
});

async function handleAuth(user) {
  if (!user) { clearUI(); return; }

  // Import modular SDK functions now that Firebase is ready
  const FB_VER  = '10.12.0';
  const FB_BASE = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const [fsdk] = await Promise.all([
    import(`${FB_BASE}/firebase-firestore.js`),
  ]);

  _collection      = fsdk.collection;
  _doc             = fsdk.doc;
  _addDoc          = fsdk.addDoc;
  _updateDoc       = fsdk.updateDoc;
  _deleteDoc       = fsdk.deleteDoc;
  _onSnapshot      = fsdk.onSnapshot;
  _serverTimestamp = fsdk.serverTimestamp;
  _query           = fsdk.query;
  _orderBy         = fsdk.orderBy;

  const db = window.db;

  // Real-time listeners
  _onSnapshot(
    _query(_collection(db, 'users', user.uid, 'item_records'), _orderBy('updated_at', 'desc')),
    snap => {
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats(); renderItems();
    },
    err => HILShell.toast('Items load error: ' + err.message, 'error')
  );

  _onSnapshot(_collection(db, 'users', user.uid, 'kits'), snap => {
    allKits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderKits(); updateStats();
  });

  _onSnapshot(_collection(db, 'users', user.uid, 'vessels'), snap => {
    allVessels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderVessels();
  });
}

// ── Stats ──
function updateStats() {
  const active   = allItems.filter(i => i.status === 'active').length;
  const estValue = allItems.reduce((s, i) => s + (i.financial?.current_value || 0), 0);
  setText('stat-total',  allItems.length);
  setText('stat-active', active);
  setText('stat-kits',   allKits.length);
  setText('stat-value',  estValue > 0 ? '$' + Math.round(estValue).toLocaleString() : '—');
}

// ── Render items ──
function renderItems() {
  const q   = searchQuery.toLowerCase();
  const cat = activeCat;
  const filtered = allItems.filter(i => {
    const matchCat = !cat || i.category === cat;
    const matchQ   = !q
      || (i.display_name||'').toLowerCase().includes(q)
      || (i.hl_address||'').toLowerCase().includes(q)
      || (i.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  const list = document.getElementById('item-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="hil-empty"><div class="hil-empty-icon">🗄</div>${allItems.length ? 'No items match.' : 'No items yet. Add your first.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="item-row" data-id="${item.id}">
      <div class="item-thumb">
        ${item.hero_photo ? `<img src="${esc(item.hero_photo)}" alt="" loading="lazy">` : categoryIcon(item.category)}
      </div>
      <div class="item-info">
        <div class="item-name">${esc(item.display_name || item.name || 'Unnamed')}</div>
        <div class="item-meta">
          ${item.hl_address ? `<span class="item-address">${esc(item.hl_address)}</span>` : ''}
          <span class="item-category">${(item.category||'').toUpperCase()}</span>
          ${item.manufacturer ? `<span class="item-category">${esc(item.manufacturer)}</span>` : ''}
        </div>
      </div>
      <div><span class="hil-badge ${statusBadgeClass(item.status)}">${(item.status||'active').toUpperCase()}</span></div>
      <div class="item-actions">
        <button class="icon-btn" data-edit="${item.id}" title="Edit">✏</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.item-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('[data-edit]')) {
        openEditItem(e.target.closest('[data-edit]').dataset.edit);
        return;
      }
      const item = allItems.find(i => i.id === row.dataset.id);
      if (item) openDetailModal(item);
    });
  });
}

// ── Render kits ──
function renderKits() {
  const q = (document.getElementById('kit-search')?.value || '').toLowerCase();
  const filtered = allKits.filter(k =>
    !q || (k.name||'').toLowerCase().includes(q) || (k.kit_id||'').toLowerCase().includes(q)
  );
  const grid = document.getElementById('kit-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="hil-empty"><div class="hil-empty-icon">🧰</div>${allKits.length ? 'No kits match.' : 'No kits yet.'}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(k => `
    <div class="kit-card" data-kit-id="${k.id}">
      <div class="kit-id">${esc(k.kit_id||k.id)}</div>
      <div class="kit-name">${esc(k.name||'Unnamed Kit')}</div>
      <div class="kit-meta">${(k.domain||'').replace(/_/g,' ').toUpperCase()} · TIER ${k.tier||'—'}</div>
      <div class="kit-status-row">
        <span class="hil-badge ${statusBadgeClass(k.status)}">${(k.status||'active').toUpperCase()}</span>
        <button class="icon-btn" data-edit-kit="${k.id}">✏</button>

  grid.querySelectorAll('[data-edit-kit]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openEditKit(btn.dataset.editKit); });
  });
}

// ── Render vessels ──
function renderVessels() {

    return;
  }
  list.innerHTML = filtered.map(v => `
    <div class="item-row" style="grid-template-columns:1fr auto auto">
      <div class="item-info">

        <div class="item-meta">
          <span class="item-category">${esc(v.vessel_id||'')} · ${esc(v.prefix||'')}</span>
          ${v.hl_address ? `<span class="item-address">${esc(v.hl_address)}</span>` : ''}
        </div>
      </div>
      <span class="hil-badge ${fillBadgeClass(v.fill_level)}">${(v.fill_level||'—').toUpperCase()}</span>
      <button class="icon-btn" data-edit-vessel="${v.id}">✏</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-edit-vessel]').forEach(btn => {
    btn.addEventListener('click', () => openEditVessel(btn.dataset.editVessel));

}

// ── Detail modal ──
function openDetailModal(item) {

  document.getElementById('detail-modal-body').innerHTML = `

    ${dr('MANUFACTURER',  esc(item.manufacturer||'—'))}

// ── R2 PHOTO UPLOAD ──
const R2_WORKER = 'https://hilsystem-r2-signer.dvo77.workers.dev';

async function uploadPhotoToR2(file, uid, itemId) {
  const photoStatus = document.getElementById('photo-upload-status');
  photoStatus.textContent = '⏳ Uploading photo…';

  // Build a deterministic key: users/{uid}/items/{itemId}/hero.jpg
  const ext      = file.name.split('.').pop() || 'jpg';
  const filename = `users/${uid}/items/${itemId || ('new_' + Date.now())}/hero.${ext}`;

  // Step 1: get presigned URL from Worker
  const res = await fetch(R2_WORKER, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ filename, contentType: file.type }),
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Signer error ${res.status}: ${txt}`);
  }

  const { uploadUrl, publicUrl } = await res.json();

  // Step 2: PUT direct to R2
  const upload = await fetch(uploadUrl, {
    method:  'PUT',
    headers: { 'Content-Type': file.type },
    body:    file,
  });

  if (!upload.ok) throw new Error(`R2 upload failed: ${upload.status}`);

  photoStatus.innerHTML = '<span style="color:var(--hil-green)">✓ Photo uploaded</span>';
  return publicUrl;
}

// Wire photo file input → preview
document.getElementById('photo-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  // Show local preview immediately
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('photo-preview-img').src = ev.target.result;
    document.getElementById('photo-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);

  // Store file reference for upload at save time
  window._pendingPhotoFile = file;
  document.getElementById('photo-upload-status').textContent = 'Photo ready — will upload on save';
});

document.getElementById('photo-remove-btn').addEventListener('click', () => {
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('photo-preview-img').src = '';
  document.getElementById('f-hero-photo').value = '';
  document.getElementById('photo-file-input').value = '';
  document.getElementById('photo-upload-status').textContent = '';
  window._pendingPhotoFile = null;
});

// ── Item save (modular SDK) ──
async function saveItem() {
  const user = window.currentUser;
  if (!user) { HILShell.toast('Not signed in', 'error'); return; }

  const displayName = gv('f-display-name');
  if (!displayName) { HILShell.toast('Display name is required', 'error'); return; }

  const kitMemberships = gv('f-kit-memberships')
    ? gv('f-kit-memberships').split(',').map(s=>s.trim()).filter(Boolean) : [];

  const now = _serverTimestamp();
  const data = {
    display_name:    displayName,
    name:            displayName,
    hl_address:      gv('f-hl-address') || null,
    category:        gv('f-category'),
    status:          gv('f-status'),
    condition:       gv('f-condition'),
    manufacturer:    gv('f-manufacturer') || null,
    year_made:       gv('f-year-made') || null,
    description:     gv('f-description') || null,
    provenance:      gv('f-provenance') || null,
    narrative:       gv('f-narrative') || null,
    kit_memberships: kitMemberships,
    display: {
      vault:         gc('f-flag-vault'),
      wunderkammer:  gc('f-flag-wunderkammer'),
      history_wall:  gc('f-flag-history-wall'),
      exchange:      gc('f-flag-exchange'),
      family_ledger: gc('f-flag-family-ledger'),
      brag_shelf:    false,
      sign_studio:   false,
    },
    financial: {
      purchase_price:  parseFloat(gv('f-purchase-price')) || null,
      current_value:   parseFloat(gv('f-current-value'))  || null,
      purchase_source: gv('f-purchase-source') || null,
    },
    // SSOT ingestion fields (schema v1.3)
    source:     'manual_ui_trusted',
    schema_ver: '1.3',
    owner_uid:  user.uid,
    updated_at: now,
  };

  const btn = document.getElementById('save-item-btn');
  btn.disabled = true; btn.textContent = 'SAVING…';

  try {
    const col = _collection(window.db, 'users', user.uid, 'item_records');

    // Determine item ID (existing or generate for new)
    const targetId = editingItemId || _doc(col).id;

    // Upload photo if one is pending
    if (window._pendingPhotoFile) {
      try {
        const photoUrl = await uploadPhotoToR2(window._pendingPhotoFile, user.uid, targetId);
        data.hero_photo = photoUrl;
        window._pendingPhotoFile = null;
      } catch (photoErr) {
        HILShell.toast('Photo upload failed: ' + photoErr.message, 'error');
        btn.disabled = false; btn.textContent = 'SAVE ITEM';
        return;
      }
    } else {
      // Keep existing hero_photo if editing and no new photo chosen
      const existing = gv('f-hero-photo');
      if (existing) data.hero_photo = existing;
    }

    if (editingItemId) {
      await _updateDoc(_doc(window.db, 'users', user.uid, 'item_records', editingItemId), data);
      HILShell.toast('Item updated ✓');
    } else {
      data.created_at = now;
      await _updateDoc(_doc(window.db, 'users', user.uid, 'item_records', targetId), data)
        .catch(() => _addDoc(col, data)); // fallback to addDoc if doc doesn't exist yet
      HILShell.toast('Item added ✓');
    }

    closeModal('item-modal');
    editingItemId = null;
  } catch (err) {
    HILShell.toast('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'SAVE ITEM';
  }
}

// ── Item delete ──
async function deleteItem() {
  if (!detailItem) return;
  if (!confirm(`Delete "${detailItem.display_name||detailItem.name}"? Cannot be undone.`)) return;
  const user = window.currentUser;
  try {
    await _deleteDoc(_doc(window.db, 'users', user.uid, 'item_records', detailItem.id));
    HILShell.toast('Item deleted');
    closeModal('detail-modal');
    detailItem = null;
  } catch (err) {
    HILShell.toast('Delete failed: ' + err.message, 'error');
  }
}

  sc('f-flag-vault', true);

  sv('f-display-name',   item.display_name||'');

  sv('f-year-made',      item.year_made||'');
  sv('f-description',    item.description||'');
  sv('f-provenance',     item.provenance||'');
  sv('f-narrative',      item.narrative||'');
  sv('f-purchase-price', item.financial?.purchase_price ?? '');
  sv('f-current-value',  item.financial?.current_value  ?? '');
  sv('f-purchase-source',item.financial?.purchase_source||'');
  sv('f-kit-memberships',(item.kit_memberships||[]).join(', '));
  ss('f-category',  item.category||'tool');
  ss('f-status',    item.status||'active');
  ss('f-condition', item.condition||'unknown');
  const d = item.display || {};
  sc('f-flag-vault',          d.vault         ?? true);
  sc('f-flag-wunderkammer',   d.wunderkammer  ?? false);
  sc('f-flag-history-wall',   d.history_wall  ?? false);
  sc('f-flag-exchange',       d.exchange       ?? false);
  sc('f-flag-family-ledger',  d.family_ledger ?? false);

  // Restore hero photo preview
  window._pendingPhotoFile = null;
  const heroPhoto = item.hero_photo || '';
  sv('f-hero-photo', heroPhoto);
  if (heroPhoto) {
    document.getElementById('photo-preview-img').src = heroPhoto;
    document.getElementById('photo-preview').style.display = 'block';
    document.getElementById('photo-upload-status').textContent = '';
  } else {
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('photo-preview-img').src = '';
    document.getElementById('photo-upload-status').textContent = '';
  }
} // end fillItemForm

// ── Kit save ──
async function saveKit() {
  const user = window.currentUser;
  if (!user) { HILShell.toast('Not signed in','error'); return; }
  const kitId = gv('k-kit-id'), name = gv('k-name');
  if (!kitId || !name) { HILShell.toast('Kit ID and name required','error'); return; }
  const capabilities = gv('k-capabilities').split('\n').map(s=>s.trim()).filter(Boolean);
  const now  = _serverTimestamp();
  const data = {
    kit_id: kitId, prefix: gv('k-prefix'), name,
    domain: gv('k-domain'), tier: parseInt(gv('k-tier')),
    status: gv('k-status'), hl_address: gv('k-hl-address')||null,
    capabilities, owner_uid: user.uid, updated_at: now,
  };
  const btn = document.getElementById('save-kit-btn');
  btn.disabled = true; btn.textContent = 'SAVING…';
  try {
    const col = _collection(window.db, 'users', user.uid, 'kits');
    if (editingKitId) {
      await _updateDoc(_doc(window.db, 'users', user.uid, 'kits', editingKitId), data);
      HILShell.toast('Kit updated ✓');
    } else {
      data.created_at = now;
      await _addDoc(col, data);
      HILShell.toast('Kit added ✓');
    }
    closeModal('kit-modal'); editingKitId = null;
  } catch (err) { HILShell.toast('Save failed: ' + err.message, 'error');
  } finally { btn.disabled = false; btn.textContent = 'SAVE KIT'; }
}

function openAddKit() {
  editingKitId = null; setText('kit-modal-title','ADD KIT');
  ['k-kit-id','k-name','k-hl-address','k-capabilities'].forEach(id => sv(id,''));
  ss('k-prefix','TK'); ss('k-domain','domestic_culinary'); ss('k-tier','2'); ss('k-status','active');
  openModal('kit-modal');
}
function openEditKit(id) {
  const k = allKits.find(x => x.id === id); if (!k) return;
  editingKitId = id; setText('kit-modal-title','EDIT KIT');
  sv('k-kit-id', k.kit_id||''); sv('k-name', k.name||'');
  sv('k-hl-address', k.hl_address||'');
  sv('k-capabilities', (k.capabilities||[]).join('\n'));
  ss('k-prefix', k.prefix||'TK'); ss('k-domain', k.domain||'domestic_culinary');
  ss('k-tier', String(k.tier||2)); ss('k-status', k.status||'active');
  openModal('kit-modal');
}

function openAddVessel() {

// ── Tabs ──
document.querySelectorAll('.vault-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ['items','kits','vessels'].forEach(t => {
      document.getElementById('tab-'+t).style.display = t === activeTab ? '' : 'none';
    });
  });
});

// ── Search / filters ──
document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value; renderItems(); });
document.getElementById('kit-search').addEventListener('input', renderKits);
document.getElementById('vessel-search').addEventListener('input', renderVessels);
document.getElementById('category-filters').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip'); if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active'); activeCat = chip.dataset.cat; renderItems();
});

// ── Button wiring ──
document.getElementById('add-item-btn').addEventListener('click', openAddItem);
document.getElementById('save-item-btn').addEventListener('click', saveItem);
document.getElementById('detail-edit-btn').addEventListener('click', () => { if (detailItem) openEditItem(detailItem.id); });
document.getElementById('detail-delete-btn').addEventListener('click', deleteItem);
document.getElementById('add-kit-btn').addEventListener('click', openAddKit);
document.getElementById('save-kit-btn').addEventListener('click', saveKit);
document.getElementById('add-vessel-btn').addEventListener('click', openAddVessel);
document.getElementById('save-vessel-btn').addEventListener('click', saveVessel);

// ── Modals ──
window.openModal  = id => document.getElementById(id)?.classList.add('open');
window.closeModal = id => document.getElementById(id)?.classList.remove('open');

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.hil-modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
});

// ── Clear on sign-out ──
function clearUI() {
  allItems = []; allKits = []; allVessels = [];
  document.getElementById('item-list').innerHTML   = '<div class="hil-empty">Sign in to view your inventory.</div>';
  document.getElementById('kit-grid').innerHTML    = '<div class="hil-empty">Sign in to view kits.</div>';
  document.getElementById('vessel-list').innerHTML = '<div class="hil-empty">Sign in to view vessels.</div>';
  ['stat-total','stat-active','stat-kits','stat-value'].forEach(id => setText(id,'—'));
}

// ── Micro-helpers ──
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dr  = (k,v) => `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`;
const gv  = id => (document.getElementById(id)?.value||'').trim();
const gc  = id => !!document.getElementById(id)?.checked;
const sv  = (id,v) => { const el=document.getElementById(id); if(el) el.value=v; };
const ss  = (id,v) => { const el=document.getElementById(id); if(el) el.value=v; };
const sc  = (id,v) => { const el=document.getElementById(id); if(el) el.checked=!!v; };
const setText = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };

function statusBadgeClass(s) {
  return {active:'green',transferred:'gray',donated:'amber',passed_on:'gray',lost:'red'}[s]||'gray';
}
function fillBadgeClass(f) {
  return {full:'green',medium:'',low:'amber',empty:'red'}[f]||'';
}
function categoryIcon(cat) {
  return {tool:'🔧',collectible:'🏺',heirloom:'🪆',ephemera:'📄',
          media:'📼',artwork:'🖼',document:'📋',specimen:'🔬',other:'📦'}[cat]||'📦';
}
