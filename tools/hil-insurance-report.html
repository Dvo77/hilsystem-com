<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Report · HIL System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
<script src="./hil-shell.js"></script>
<style>
  .ir-main { padding: 24px; max-width: 980px; margin: 0 auto; }

  .ir-controls {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 16px; margin-bottom: 20px;
    background: var(--hil-surface); border: 1px solid var(--hil-border);
  }
  .ir-controls label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--hil-text-muted); text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .ir-controls select, .ir-controls input[type=number] {
    background: var(--hil-surface-2); border: 1px solid var(--hil-border);
    color: var(--hil-text); font-family: var(--font-ui); font-size: 14px;
    padding: 6px 10px;
  }
  .ir-controls input[type=number] { width: 70px; }
  .ir-btn {
    background: none; border: 1px solid var(--hil-green); color: var(--hil-green);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 8px 16px; cursor: pointer;
    transition: all 0.15s; margin-left: auto;
  }
  .ir-btn:hover { background: var(--hil-green-dim); }

  .ir-report { background: var(--hil-surface); border: 1px solid var(--hil-border); padding: 32px; }

  /* .hil-report-header/.hil-report-title/etc. now come from hil-shell.js's
     shared REPORT MODE component — no need to redeclare that CSS per tool. */
  .ir-grand-total-top {
    margin-top: 14px; font-family: var(--font-display); font-size: 20px; color: var(--hil-green);
  }
  .ir-grand-total-top span { font-family: var(--font-mono); font-size: 11px; color: var(--hil-text-muted); margin-right: 8px; }

  .ir-room { margin: 28px 0 8px; }
  .ir-room-title {
    font-family: var(--font-ui); font-weight: 600; font-size: 16px; color: var(--hil-text);
    border-bottom: 1px solid var(--hil-border); padding-bottom: 6px; margin-bottom: 4px;
  }

  table.ir-table { width: 100%; border-collapse: collapse; font-family: var(--font-ui); font-size: 13px; }
  table.ir-table th {
    text-align: left; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--hil-text-muted); padding: 6px 8px; border-bottom: 1px solid var(--hil-border);
  }
  table.ir-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  table.ir-table td.num { text-align: right; font-family: var(--font-mono); }
  .ir-thumb { width: 40px; height: 40px; object-fit: cover; border: 1px solid var(--hil-border); background: var(--hil-surface-2); }
  .ir-thumb-empty { width: 40px; height: 40px; border: 1px dashed var(--hil-border); }
  .ir-item-name { font-weight: 600; }
  .ir-item-name a { color: var(--hil-text); text-decoration: none; }
  .ir-item-addr { font-family: var(--font-mono); font-size: 10px; color: var(--hil-text-muted); }
  .ir-baseline-note { font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); }

  .ir-rider-flag {
    display: inline-block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em;
    padding: 2px 6px; border: 1px solid var(--hil-amber); color: var(--hil-amber); text-transform: uppercase;
  }

  .ir-subtotal-row td { font-family: var(--font-mono); font-size: 11px; color: var(--hil-text-muted); border-bottom: none; padding-top: 4px; }
  .ir-subtotal-row .num { color: var(--hil-text); font-weight: 700; }

  .ir-report-footer {
    margin-top: 32px; padding-top: 16px; border-top: 2px solid var(--hil-green);
  }
  .ir-grand-total-bottom { font-family: var(--font-display); font-size: 22px; color: var(--hil-green); }
  .ir-methodology {
    margin-top: 14px; font-family: var(--font-ui); font-size: 11px; color: var(--hil-text-muted);
    line-height: 1.5; max-width: 640px;
  }

  .ir-empty { text-align: center; color: var(--hil-text-muted); font-family: var(--font-ui); padding: 60px 0; }

  @media print {
    /* Chrome-hiding, letterhead, and the shared footer now live centrally
       in hil-shell.js's @media print rules — every report tool gets them
       automatically. This block only needs insurance-report-specific
       overrides on top. */
    .ir-controls { display: none !important; }
    .ir-main { padding: 0; max-width: none; }
    .ir-report { border: none; padding: 0; background: #fff; color: #000; }
    .ir-room-title, .ir-grand-total-top, .ir-grand-total-bottom { color: #000 !important; }
    .ir-grand-total-top, .ir-grand-total-bottom { font-weight: 700; }
    .ir-item-addr, .ir-baseline-note, .ir-methodology, .ir-subtotal-row td { color: #333 !important; }
    table.ir-table th { color: #555 !important; border-bottom-color: #999; }
    table.ir-table td { border-bottom-color: #ddd; }
    .ir-rider-flag { border-color: #b8860b; color: #b8860b; }
    .ir-room { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<main class="ir-main">
  <div class="ir-controls">
    <label>Property
      <select id="property-select"></select>
    </label>
    <label>Fee Adjustment %
      <input type="number" id="fee-pct-input" min="0" max="90" step="1">
    </label>
    <label style="flex-direction:row-reverse;">
      <input type="checkbox" id="fee-pct-save" style="width:auto;">
      Save as default
    </label>
    <button class="ir-btn" id="print-btn">Print / Save PDF</button>
  </div>

  <div id="report-container"><div class="ir-empty">Loading…</div></div>
</main>

<script type="module">
let _collection, _doc, _getDocs, _setDoc, _getDoc;
let db, user;
let properties = [];
let zonesByProperty = {};   // { propertyId: { ZONECODE: label } }
let items = [];
let feePct = 20; // percent, UI-facing (0.20 stored)

HILShell.init({
  toolId:      'insurance-report',
  toolName:    'Insurance Report',
  requireAuth: true,
  onAuth:      handleAuth,
});

async function handleAuth(u) {
  if (!u) {
    document.getElementById('report-container').innerHTML =
      '<div class="ir-empty">Sign in to generate an insurance report.</div>';
    return;
  }
  user = u;
  db = window.db;

  const FB_BASE = 'https://www.gstatic.com/firebasejs/10.12.0';
  const fsdk = await import(`${FB_BASE}/firebase-firestore.js`);
  _collection = fsdk.collection;
  _doc        = fsdk.doc;
  _getDocs    = fsdk.getDocs;
  _setDoc     = fsdk.setDoc;
  _getDoc     = fsdk.getDoc;

  await loadFeePref();
  await loadProperties();
  await loadItems();
  renderReport();

  document.getElementById('property-select').addEventListener('change', renderReport);
  document.getElementById('fee-pct-input').addEventListener('input', e => {
    feePct = parseFloat(e.target.value) || 0;
    renderReport();
  });
  document.getElementById('fee-pct-save').addEventListener('change', async e => {
    if (e.target.checked) {
      await _setDoc(_doc(db, 'users', user.uid), {
        prefs: { insurance_fee_adjustment_pct: feePct / 100 }
      }, { merge: true });
      HILShell.toast('Default fee adjustment saved ✓');
      e.target.checked = false;
    }
  });
  document.getElementById('print-btn').addEventListener('click', () => window.print());
}

// ── LOAD FEE % (global user pref, default 20%) ──
async function loadFeePref() {
  try {
    const snap = await _getDoc(_doc(db, 'users', user.uid));
    const stored = snap.exists() ? snap.data()?.prefs?.insurance_fee_adjustment_pct : null;
    feePct = (typeof stored === 'number') ? Math.round(stored * 100) : 20;
  } catch { feePct = 20; }
  document.getElementById('fee-pct-input').value = feePct;
}

// ── LOAD PROPERTIES + ZONES ──
async function loadProperties() {
  const snap = await _getDocs(_collection(db, 'users', user.uid, 'properties'));
  properties = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  for (const prop of properties) {
    const zSnap = await _getDocs(_collection(db, 'users', user.uid, 'properties', prop.id, 'zones'));
    const map = {};
    zSnap.docs.forEach(zd => {
      const z = zd.data();
      map[z.code || zd.id] = z.label || z.code || zd.id;
    });
    zonesByProperty[prop.id] = map;
  }

  const sel = document.getElementById('property-select');
  sel.innerHTML = properties.map(p => `<option value="${p.id}">${escapeHtml(p.name || 'Unnamed Property')}</option>`).join('')
    || '<option value="">No properties found</option>';
}

// ── LOAD ITEMS ──
async function loadItems() {
  const snap = await _getDocs(_collection(db, 'users', user.uid, 'item_records'));
  items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ── HELPERS ──
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function zoneCodeFromAddress(addr) {
  if (!addr) return null;
  const parts = String(addr).split('-');
  return parts.length >= 2 ? parts[1] : null;
}
function resolveRoomLabel(propertyId, addr) {
  const code = zoneCodeFromAddress(addr);
  if (!code) return 'Unassigned Location';
  const label = zonesByProperty[propertyId]?.[code];
  return label || addr; // fallback to raw hl_address per zone resolution doctrine
}

// ── RENDER ──
function renderReport() {
  const container = document.getElementById('report-container');
  const propertyId = document.getElementById('property-select').value;
  const property = properties.find(p => p.id === propertyId);

  if (!property) {
    container.innerHTML = '<div class="ir-empty">No property selected. Add a property in Room Visualizer / Room Code Builder first.</div>';
    return;
  }

  // Inclusion filter: current_value OR insured_value populated
  const included = items.filter(it => {
    const f = it.financial || {};
    return (typeof f.current_value === 'number') || (typeof f.insured_value === 'number');
  });

  if (included.length === 0) {
    container.innerHTML = `
      <div class="ir-report">
        ${HILShell.reportHeader({
          title: escapeHtml(property.name || 'Unnamed Property'),
          subtitle: escapeHtml(property.address || '')
        })}
        <div class="ir-empty">No items have insured or current value set yet — nothing to report.</div>
      </div>`;
    return;
  }

  // Group by room
  const rooms = {}; // label -> [items]
  const feeFraction = (feePct || 0) / 100;

  included.forEach(it => {
    const label = resolveRoomLabel(propertyId, it.hl_address);
    if (!rooms[label]) rooms[label] = [];

    const baseline = typeof it.exchange?.ebay_baseline === 'number' ? it.exchange.ebay_baseline : null;
    const adjustedValue = baseline !== null ? baseline * (1 - feeFraction) : null;
    const requestedCoverage = typeof it.financial?.insured_value === 'number'
      ? it.financial.insured_value
      : (typeof it.financial?.current_value === 'number' ? it.financial.current_value : null);

    let riderFlag = false;
    if (adjustedValue !== null && requestedCoverage !== null && adjustedValue > 0) {
      riderFlag = (requestedCoverage - adjustedValue) / adjustedValue > 0.20;
    } else if (adjustedValue === null && requestedCoverage !== null && requestedCoverage > 0) {
      riderFlag = 'no-comp'; // no eBay baseline to compare against — flag for manual review
    }

    rooms[label].push({ it, baseline, adjustedValue, requestedCoverage, riderFlag });
  });

  const grandTotal = included.reduce((sum, it) => {
    const rc = typeof it.financial?.insured_value === 'number' ? it.financial.insured_value
      : (typeof it.financial?.current_value === 'number' ? it.financial.current_value : 0);
    return sum + rc;
  }, 0);

  const roomLabels = Object.keys(rooms).sort();

  let html = `
    <div class="ir-report">
      ${HILShell.reportHeader({
        title: escapeHtml(property.name || 'Unnamed Property'),
        subtitle: escapeHtml(property.address || ''),
        meta: `Prepared for insurance purposes · Generated ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })} · ${included.length} item${included.length !== 1 ? 's' : ''}`
      })}
      <div class="ir-grand-total-top"><span>TOTAL REQUESTED COVERAGE</span>${fmtMoney(grandTotal)}</div>
  `;

  roomLabels.forEach(label => {
    const rows = rooms[label];
    const subtotal = rows.reduce((s, r) => s + (r.requestedCoverage || 0), 0);

    html += `
      <div class="ir-room">
        <div class="ir-room-title">${escapeHtml(label)}</div>
        <table class="ir-table">
          <thead>
            <tr>
              <th></th><th>Item</th><th class="num">Purchase Price</th>
              <th class="num">eBay Adjusted Value</th><th class="num">Requested Coverage</th><th>Rider</th>
            </tr>
          </thead>
          <tbody>
    `;

    rows.forEach(r => {
      const it = r.it;
      const photo = it.hero_photo
        ? `<img class="ir-thumb" src="${escapeHtml(it.hero_photo)}" alt="">`
        : `<div class="ir-thumb-empty"></div>`;
      const name = it.display_name || it.name || 'Unnamed Item';
      const receiptLink = it.financial?.receipt_url
        ? ` · <a href="${escapeHtml(it.financial.receipt_url)}" target="_blank" style="color:var(--hil-text-muted);">receipt</a>`
        : '';

      let riderCell = '';
      if (r.riderFlag === true) riderCell = '<span class="ir-rider-flag">Rider?</span>';
      else if (r.riderFlag === 'no-comp') riderCell = '<span class="ir-rider-flag">No Comp</span>';

      html += `
        <tr>
          <td>${photo}</td>
          <td>
            <div class="ir-item-name">${escapeHtml(name)}</div>
            <div class="ir-item-addr">${escapeHtml(it.hl_address || '')}${receiptLink}</div>
          </td>
          <td class="num">${fmtMoney(it.financial?.purchase_price)}</td>
          <td class="num">
            ${fmtMoney(r.adjustedValue)}
            ${r.baseline !== null ? `<div class="ir-baseline-note">raw comp: ${fmtMoney(r.baseline)}</div>` : ''}
          </td>
          <td class="num">${fmtMoney(r.requestedCoverage)}</td>
          <td>${riderCell}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
          <tfoot>
            <tr class="ir-subtotal-row">
              <td colspan="4"></td>
              <td class="num">${fmtMoney(subtotal)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    `;
  });

  html += `
      <div class="ir-report-footer">
        <div class="ir-grand-total-bottom">Grand Total: ${fmtMoney(grandTotal)}</div>
        <div class="ir-methodology">
          <strong>eBay Adjustment Methodology:</strong> "eBay Adjusted Value" applies a ${feePct}% deduction
          to the raw eBay comp (final value fees, promoted listing costs, and shipping) to approximate
          real achievable resale value. Raw comp shown below each adjusted figure for reference.
          Items flagged <span class="ir-rider-flag" style="vertical-align:middle;">Rider?</span> have
          requested coverage exceeding adjusted value by more than 20% — consider a scheduled/agreed-value
          rider rather than relying on blanket personal property sub-limits. Items flagged
          <span class="ir-rider-flag" style="vertical-align:middle;">No Comp</span> have no eBay baseline
          on file to verify against and should be reviewed manually.
        </div>
      </div>
    </div>
  `;

  container.innerHTML = html;
}
</script>
</body>
</html>
