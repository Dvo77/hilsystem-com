<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIL Room Visualizer — Room Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="./hil-shell.js"></script>

<style>
  .hil-container { max-width: 1180px; margin: 0 auto; padding: 24px 16px 100px; }

  .rd-page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .rd-page-head h1 { font-family: var(--font-display); font-size: 20px; letter-spacing: 3px; color: var(--hil-green); text-transform: uppercase; }
  .rd-back { font-family: var(--font-mono); font-size: 11px; color: var(--hil-text-muted); text-decoration: none; letter-spacing: 1px; }
  .rd-back:hover { color: var(--hil-green); }
  .rd-sub { font-family: var(--font-mono); font-size: 10px; color: var(--hil-text-muted); letter-spacing: 1px; margin-bottom: 16px; }

  .rd-main { display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
  @media (max-width: 860px) { .rd-main { grid-template-columns: 1fr; } }

  .rd-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .rd-tool-btn {
    font-family: var(--font-display); font-size: 10px; letter-spacing: 1.5px;
    padding: 9px 14px; background: var(--hil-surface-2); border: 1px solid var(--hil-border);
    color: var(--hil-text); cursor: pointer; transition: all .15s;
  }
  .rd-tool-btn:hover { border-color: var(--hil-text-muted); }
  .rd-tool-btn.active { background: var(--hil-green); color: #000; border-color: var(--hil-green); }
  .rd-tool-btn.danger { color: var(--hil-danger); border-color: var(--hil-border); }
  .rd-tool-btn.danger:hover { border-color: var(--hil-danger); }
  .rd-hint { font-family: var(--font-mono); font-size: 10px; color: var(--hil-text-muted); letter-spacing: .5px; margin-left: auto; }

  .rd-canvas-wrap { background: var(--hil-surface); border: 1px solid var(--hil-border); overflow: hidden; touch-action: none; }
  .rd-canvas-wrap.placing { cursor: crosshair; }
  svg.rd-svg { display: block; width: 100%; height: auto; }

  .rd-room-bg { stroke-width: 2; }
  .rd-container-icon { cursor: pointer; }
  .rd-container-icon circle, .rd-container-icon rect, .rd-container-icon polygon { stroke: #000; stroke-width: 1.5; }
  .rd-container-icon.pending circle, .rd-container-icon.pending rect, .rd-container-icon.pending polygon { opacity: .45; stroke-dasharray: 3 2; }
  .rd-container-icon text { font-family: var(--font-mono); font-size: 11px; fill: #fff; text-anchor: middle; pointer-events: none; }
  .rd-container-icon.selected circle, .rd-container-icon.selected rect, .rd-container-icon.selected polygon { stroke: #fff; stroke-width: 2.5; }

  .rd-panel { background: var(--hil-surface); border: 1px solid var(--hil-border); padding: 14px; align-self: start; }
  .rd-panel h3 { font-family: var(--font-display); font-size: 10px; letter-spacing: 2.5px; color: var(--hil-text-muted); text-transform: uppercase; border-bottom: 1px solid var(--hil-border); padding-bottom: 8px; margin-bottom: 10px; }
  .rd-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; cursor: pointer; border: 1px solid transparent; transition: all .12s; }
  .rd-item-row:hover { background: var(--hil-surface-2); }
  .rd-item-row.selected { border-color: var(--hil-green); background: var(--hil-green-dim); }
  .rd-item-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .rd-item-info { flex: 1; min-width: 0; }
  .rd-item-name { font-size: 13px; color: var(--hil-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-item-sub { font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); letter-spacing: 1px; }
  .rd-empty-panel { font-family: var(--font-mono); font-size: 11px; color: var(--hil-text-muted); text-align: center; padding: 20px 8px; line-height: 1.6; }

  .rd-edit-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hil-border); }
  .rd-field { margin-bottom: 10px; }
  .rd-field label { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px; color: var(--hil-text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .rd-field input, .rd-field select {
    width: 100%; background: var(--hil-bg); border: 1px solid var(--hil-border); color: var(--hil-text);
    font-family: var(--font-mono); font-size: 13px; padding: 8px 10px; outline: none;
  }
  .rd-field input:focus, .rd-field select:focus { border-color: var(--hil-green); }
  .rd-edit-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rd-edit-actions .rd-tool-btn { flex: 1; text-align: center; }

  /* ── NESTED CONTENTS DRILL-DOWN ── */
  .rd-nest-toggle { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--hil-text-muted); letter-spacing: .5px; margin-bottom: 4px; cursor: pointer; }
  .rd-nest-toggle input { width: 14px; height: 14px; }
  .rd-contents-block { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--hil-border); }
  .rd-breadcrumb { font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); letter-spacing: .5px; margin-bottom: 8px; word-break: break-word; }
  .rd-breadcrumb a { color: var(--hil-green); cursor: pointer; text-decoration: none; }
  .rd-breadcrumb a:hover { text-decoration: underline; }
  .rd-child-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border: 1px solid transparent; cursor: pointer; }
  .rd-child-row:hover { background: var(--hil-surface-2); }
  .rd-child-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .rd-child-name { font-size: 12px; color: var(--hil-text); flex: 1; }
  .rd-child-badge { font-family: var(--font-mono); font-size: 8px; color: var(--hil-text-muted); }
  .rd-add-child-form { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .rd-add-child-form input[type="text"] {
    background: var(--hil-bg); border: 1px solid var(--hil-border); color: var(--hil-text);
    font-family: var(--font-mono); font-size: 12px; padding: 7px 8px; outline: none;
  }
  .rd-add-child-form label { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 9px; color: var(--hil-text-muted); }
  .rd-locked-note { font-family: var(--font-mono); font-size: 10px; color: var(--hil-warning); line-height: 1.5; }

  .rd-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
  .rd-modal-overlay.open { display: flex; }
  .rd-modal { background: var(--hil-surface); border: 1px solid var(--hil-green); padding: 24px; width: 380px; max-width: 100%; }
  .rd-modal h2 { font-family: var(--font-display); font-size: 16px; letter-spacing: 2px; color: var(--hil-green); text-transform: uppercase; margin-bottom: 16px; }
  .rd-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .rd-modal-actions .rd-tool-btn { flex: 1; text-align: center; }
  .rd-type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .rd-type-toggle button {
    flex: 1; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; padding: 10px 6px;
    background: var(--hil-bg); border: 1px solid var(--hil-border); color: var(--hil-text-muted); cursor: pointer;
  }
  .rd-type-toggle button.active { border-color: var(--hil-green); color: var(--hil-green); background: var(--hil-green-dim); }
  .rd-type-note { font-family: var(--font-mono); font-size: 10px; color: var(--hil-text-muted); margin-top: -4px; margin-bottom: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div class="hil-container">

  <div class="rd-page-head">
    <div>
      <h1 id="rd-title">Room Detail</h1>
    </div>
    <a class="rd-back" href="./hil-room-visualizer.html">← Back to Floor Plan</a>
  </div>
  <div class="rd-sub" id="rd-sub">Loading room…</div>

  <div class="rd-main">
    <div>
      <div class="rd-toolbar">
        <button class="rd-tool-btn" id="btn-place" onclick="setMode('place')">＋ Add Container</button>
        <button class="rd-tool-btn active" id="btn-view" onclick="setMode('view')">↖ View</button>
        <span class="rd-hint" id="rd-hint">Loading…</span>
      </div>

      <div class="rd-canvas-wrap" id="canvas-wrap">
        <svg class="rd-svg" id="rd-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22281f" stroke-width="1"/>
            </pattern>
          </defs>
          <g id="room-layer"></g>
          <g id="containers-layer"></g>
          <g id="compass"></g>
        </svg>
      </div>
    </div>

    <div class="rd-panel">
      <h3>Containers <span id="c-count">(0)</span></h3>
      <div id="c-list"><div class="rd-empty-panel">Nothing placed yet.<br>Tap Add Container to start.</div></div>

      <div class="rd-edit-block" id="edit-block" style="display:none">
        <h3>Selected</h3>
        <div class="rd-field">
          <label>Name</label>
          <input type="text" id="edit-name" disabled>
        </div>
        <div class="rd-field" id="edit-fill-wrap">
          <label>Fill Level</label>
          <select id="edit-fill">
            <option value="empty">Empty</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="full">Full</option>
          </select>
        </div>
        <div class="rd-field" id="edit-color-wrap">
          <label>Color</label>
          <div class="rv-swatches" id="edit-color"></div>
        </div>
        <div class="rd-hint" style="margin:6px 0 0;display:block">Drag the icon on the canvas to move it.</div>
        <label class="rd-nest-toggle" id="edit-nest-toggle-wrap" style="display:none">
          <input type="checkbox" id="edit-nest-toggle" onchange="toggleNesting(this.checked)">
          Nested contents (track what's inside)
        </label>
        <div class="rd-edit-actions">
          <button class="rd-tool-btn" onclick="saveFillLevel()">💾 Save</button>
          <button class="rd-tool-btn danger" onclick="deleteContainer()">🗑 Delete</button>
        </div>
        <div class="rd-contents-block" id="contents-block" style="display:none">
          <h3>Contents</h3>
          <div class="rd-breadcrumb" id="contents-breadcrumb"></div>
          <div id="contents-list"></div>
          <div id="contents-add-area"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NEW CONTAINER MODAL -->
<div class="rd-modal-overlay" id="new-container-modal">
  <div class="rd-modal">
    <h2>New Container</h2>
    <div class="rd-type-toggle">
      <button class="active" id="type-quick" onclick="setContainerType('quick')">Quick Shelf</button>
      <button id="type-full" onclick="setContainerType('full')">Full Container Item</button>
    </div>
    <div class="rd-type-note" id="type-note">Lightweight — fill-level tracking only, no item enumeration. Saves instantly.</div>
    <div class="rd-field">
      <label>Name</label>
      <input type="text" id="nc-name" placeholder="Nightstand" autocomplete="off">
    </div>
    <div class="rd-field" id="nc-prefix-wrap">
      <label>Vessel Type</label>
      <select id="nc-prefix" onchange="onPrefixChange()">
        <option value="MS">MS — Metal Shop Cart</option>
        <option value="SP">SP — Supply Container</option>
        <option value="BX">BX — Box</option>
        <option value="TB">TB — Tote Bin</option>
        <option value="BG">BG — Bag</option>
        <option value="SH">SH — Shelf Unit</option>
        <option value="DR">DR — Drawer / Dresser</option>
        <option value="FN">FN — Furniture, Surface (nightstand, table)</option>
        <option value="FB">FB — Furniture, Bed</option>
        <option value="FC">FC — Furniture, Seating (chair, couch)</option>
        <option value="CUSTOM">Custom label…</option>
      </select>
    </div>
    <div class="rd-field" id="nc-custom-wrap" style="display:none">
      <label>Custom Type Code (2–3 letters)</label>
      <input type="text" id="nc-custom-prefix" maxlength="3" placeholder="NS" style="text-transform:uppercase">
    </div>
    <div class="rd-field" id="nc-kit-section">
      <label>Kit</label>
      <select id="nc-kit-mode" onchange="onKitModeChange()">
        <option value="none">No kit — just a plain vessel</option>
        <option value="existing">Link an existing kit</option>
        <option value="new">Create a new kit</option>
      </select>
    </div>
    <div class="rd-field" id="nc-kit-existing-wrap" style="display:none">
      <label>Existing Kit</label>
      <select id="nc-kit-existing"></select>
    </div>
    <div id="nc-kit-new-wrap" style="display:none">
      <div class="rd-field">
        <label>Kit Name</label>
        <input type="text" id="nc-kit-name" placeholder="Screen Repair Kit">
      </div>
      <div class="rd-field">
        <label>Kit Type</label>
        <select id="nc-kit-prefix">
          <option value="TK">TK — Tool Kit</option>
          <option value="SK">SK — Supply Kit</option>
          <option value="MK">MK — Material Kit</option>
          <option value="CK">CK — Care Kit</option>
          <option value="FC">FC — Family Kit</option>
        </select>
      </div>
      <div class="rd-field">
        <label>Domain</label>
        <select id="nc-kit-domain">
          <option value="domestic_culinary">Domestic / Culinary</option>
          <option value="machining_metalwork">Machining / Metalwork</option>
          <option value="woodcraft_restoration">Woodcraft / Restoration</option>
          <option value="fine_arts_musical">Fine Arts / Musical</option>
          <option value="materia_medica_lab">Materia Medica / Lab</option>
          <option value="outdoor_homestead">Outdoor / Homestead</option>
        </select>
      </div>
      <div class="rd-field">
        <label>Tier</label>
        <select id="nc-kit-tier">
          <option value="1">1 — Domestic Base</option>
          <option value="2">2 — Project</option>
          <option value="3">3 — Capability</option>
        </select>
      </div>
    </div>
    <div class="rd-field">
      <label>Icon Shape <span style="opacity:.6">(placeholder until real icons)</span></label>
      <div class="rv-swatches" id="nc-shapes">
        <div class="rv-swatch shape-pick" data-shape="circle" onclick="pickShape('nc-shapes','circle')" style="border-radius:50%;background:#555"></div>
        <div class="rv-swatch shape-pick" data-shape="square" onclick="pickShape('nc-shapes','square')" style="background:#555"></div>
        <div class="rv-swatch shape-pick" data-shape="triangle" onclick="pickShape('nc-shapes','triangle')" style="background:#555;clip-path:polygon(50% 0%, 0% 100%, 100% 100%)"></div>
      </div>
    </div>
    <div class="rd-field">
      <label>Color <span style="opacity:.6">(tell apart two of the same thing)</span></label>
      <div class="rv-swatches" id="nc-color"></div>
    </div>
    <div class="rd-modal-actions">
      <button class="rd-tool-btn" onclick="saveNewContainer()">💾 Place Container</button>
      <button class="rd-tool-btn danger" onclick="closeModal('new-container-modal')">✕ Cancel</button>
    </div>
  </div>
</div>

<style>
  .rv-swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .rv-swatch { width: 26px; height: 26px; cursor: pointer; border: 2px solid transparent; }
  .rv-swatch.active { border-color: #fff; }
</style>

<script>
const SNAP = 20;
const PALETTE = ['#00cc66','#4a9eed','#ffd84c','#ff5c5c','#cc8800','#8a6de0','#4cd9ff','#ff8fb3'];
let db, currentUser;
let _collection,_doc,_setDoc,_addDoc,_updateDoc,_deleteDoc,_onSnapshot,_serverTimestamp,_query,_where;

const params = new URLSearchParams(location.search);
const propertyId = params.get('property');
const zoneCode = params.get('zone');

let property = null;
let zone = null;
let vessels = [];
let pendingItems = [];
let committedContainers = [];  // item_records with containment.is_container==true in this zone
let kits = [];                 // this user's Kit registry, for linking at vessel creation
let mode = 'view';           // 'view' | 'place'
let selectedId = null;       // { kind:'vessel'|'pending'|'committed', id }
let containerType = 'quick'; // 'quick' | 'full'
let pendingPlacePoint = null;
let draggingId = null;

let drillStack = [];         // [{id, name}] root container -> ... -> current parent, while viewing Contents
let unsubChildrenCommitted = null;
let unsubChildrenPending = null;
let unsubChildrenVessels = null;
let childrenCommitted = [];
let childrenPending = [];
let childrenVessels = [];

HILShell.init({
  toolId:      'room-visualizer',
  toolName:    'Room Visualizer',
  requireAuth: true,
  onAuth:      handleAuth,
});

async function handleAuth(user) {
  if (!user) return;
  currentUser = user;

  if (!propertyId || !zoneCode) {
    document.getElementById('rd-sub').textContent = 'Missing property or zone in the link. Go back to the Floor Plan and open a room from there.';
    return;
  }

  const FB_VER  = '10.12.0';
  const FB_BASE = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const fsdk = await import(`${FB_BASE}/firebase-firestore.js`);
  _collection = fsdk.collection; _doc = fsdk.doc; _setDoc = fsdk.setDoc;
  _addDoc = fsdk.addDoc; _updateDoc = fsdk.updateDoc; _deleteDoc = fsdk.deleteDoc;
  _onSnapshot = fsdk.onSnapshot; _serverTimestamp = fsdk.serverTimestamp;
  _query = fsdk.query; _where = fsdk.where;

  db = window.db;
  watchZone();
  watchVessels();
  watchPendingItems();
  watchCommittedContainers();
  watchKits();
}

// ══════════════════════════════════════
// LOAD ROOM
// ══════════════════════════════════════
function watchZone() {
  const zoneRef = _doc(db, 'users', currentUser.uid, 'properties', propertyId, 'zones', zoneCode);
  _onSnapshot(zoneRef, snap => {
    if (!snap.exists()) {
      document.getElementById('rd-sub').textContent = 'This room no longer exists — it may have been deleted from the Floor Plan.';
      return;
    }
    zone = snap.data();
    document.getElementById('rd-title').textContent = zone.label;
    document.getElementById('rd-sub').textContent = `${zone.struct_code} · ${zoneCode} · ${zone.canonical_type}`;
    renderRoom();
    renderContainers();
  }, err => HILShell.toast('Room load error: ' + err.message, 'error'));
}

function renderRoom() {
  if (!zone || !zone.map_polygon) return;
  const pts = zone.map_polygon.points || [];
  if (!pts.length) return;

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 40;
  const vb = `${minX - pad} ${minY - pad} ${(maxX - minX) + pad * 2} ${(maxY - minY) + pad * 2}`;
  document.getElementById('rd-svg').setAttribute('viewBox', vb);

  const ptsAttr = pts.map(p => `${p.x},${p.y}`).join(' ');
  const openingsMarkup = (zone.openings || []).map(o => {
    const color = o.type === 'door' ? '#cc8800' : '#4cd9ff';
    const label = o.type === 'door' ? 'D' : 'W';
    return `
      <rect x="${o.x-9}" y="${o.y-9}" width="18" height="18" fill="${color}" stroke="#000" stroke-width="1.5" opacity="0.85"></rect>
      <text x="${o.x}" y="${o.y+4}" text-anchor="middle" font-size="9" font-weight="bold" fill="#000" font-family="monospace" pointer-events="none">${label}</text>
    `;
  }).join('');
  document.getElementById('room-layer').innerHTML = `
    <rect x="${minX - pad}" y="${minY - pad}" width="${(maxX-minX)+pad*2}" height="${(maxY-minY)+pad*2}" fill="url(#grid)"/>
    <polygon class="rd-room-bg" points="${ptsAttr}" fill="${zone.color}22" stroke="${zone.color}"></polygon>
    ${openingsMarkup}
  `;

  // Compass — assumes "up" on screen = North, matching how the Floor Plan was drawn.
  // No real building orientation is captured yet; this is a fixed screen-relative reference,
  // not a measured compass heading.
  const cx = maxX + pad - 34, cy = minY + pad + 34;
  document.getElementById('compass').innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="26" fill="rgba(0,0,0,.55)" stroke="#4a9eed" stroke-width="1.5"></circle>
    <text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="12" fill="#4a9eed" font-weight="bold" font-family="monospace">N</text>
    <text x="${cx+19}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#7a8a76" font-family="monospace">E</text>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="10" fill="#7a8a76" font-family="monospace">S</text>
    <text x="${cx-19}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#7a8a76" font-family="monospace">W</text>
    <line x1="${cx}" y1="${cy-18}" x2="${cx}" y2="${cy+18}" stroke="#3a453a" stroke-width="1"></line>
    <line x1="${cx-18}" y1="${cy}" x2="${cx+18}" y2="${cy}" stroke="#3a453a" stroke-width="1"></line>
  `;
}

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
      (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ══════════════════════════════════════
// LOAD CONTAINERS — vessels (real) + staged_items (pending)
// ══════════════════════════════════════
function watchVessels() {
  // Only top-level vessels belong on the room canvas — nested vessels (drawer inside
  // a nightstand, valet inside a drawer) have no room_position of their own and only
  // ever appear inside their parent's Contents drill-down.
  const q = _query(
    _collection(db, 'users', currentUser.uid, 'vessels'),
    _where('zone_code', '==', zoneCode),
    _where('containment.parent_ref', '==', null)
  );
  _onSnapshot(q, snap => {
    vessels = snap.docs.map(d => ({ id: d.id, kind: 'vessel', ...d.data() }));
    renderContainers();
    renderList();
  }, err => HILShell.toast('Vessel load error: ' + err.message, 'error'));
}

function watchPendingItems() {
  const q = _query(
    _collection(db, 'staged_items'),
    _where('owner_uid', '==', currentUser.uid),
    _where('zone_code', '==', zoneCode),
    _where('status', '==', 'pending_review')
  );
  _onSnapshot(q, snap => {
    pendingItems = snap.docs.map(d => ({ id: d.id, kind: 'pending', ...d.data() }));
    renderContainers();
    renderList();
  }, err => HILShell.toast('Staged items load error: ' + err.message, 'error'));
}

function watchCommittedContainers() {
  // item_records that have been committed by hil-admin-action, flagged as containers
  // in this zone. Nothing will match here until the commit-staged pipeline knows how
  // to carry containment/zone_code through — see backlog note. Written now so the
  // room canvas is ready the moment that pipeline exists.
  const q = _query(
    _collection(db, 'users', currentUser.uid, 'item_records'),
    _where('zone_code', '==', zoneCode),
    _where('containment.is_container', '==', true)
  );
  _onSnapshot(q, snap => {
    committedContainers = snap.docs.map(d => ({ id: d.id, kind: 'committed', ...d.data() }));
    renderContainers();
    renderList();
  }, err => { /* collection/index may not exist yet for some accounts — fail quiet */ });
}

function allContainers() { return [...vessels, ...pendingItems, ...committedContainers]; }

function watchKits() {
  const q = _collection(db, 'users', currentUser.uid, 'kits');
  _onSnapshot(q, snap => {
    kits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }, err => { /* fail quiet — kit-linking is optional */ });
}

// ══════════════════════════════════════
// MODE / TOOLBAR
// ══════════════════════════════════════
function setMode(m) {
  mode = m;
  selectedId = null;
  hideEditBlock();
  document.getElementById('btn-place').classList.toggle('active', m === 'place');
  document.getElementById('btn-view').classList.toggle('active', m === 'view');
  document.getElementById('canvas-wrap').classList.toggle('placing', m === 'place');
  document.getElementById('rd-hint').textContent = m === 'place'
    ? 'Tap anywhere inside the room to place a container'
    : 'Tap a container to select it, or drag it to move';
  renderContainers();
}

document.getElementById('rd-svg').addEventListener('click', evt => {
  if (mode !== 'place') return;
  const p = svgPointFromEvent(evt);
  if (!zone || !pointInPolygon(p, zone.map_polygon.points)) {
    HILShell.toast('Place inside the room outline', 'error');
    return;
  }
  pendingPlacePoint = p;
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-custom-prefix').value = '';
  document.getElementById('nc-prefix').value = 'MS';
  setContainerType('quick');
  onPrefixChange();
  document.getElementById('nc-kit-mode').value = 'none';
  document.getElementById('nc-kit-name').value = '';
  onKitModeChange();
  buildColorSwatches('nc-color', PALETTE[allContainers().length % PALETTE.length]);
  openModal('new-container-modal');
});

function onKitModeChange() {
  const val = document.getElementById('nc-kit-mode').value;
  document.getElementById('nc-kit-existing-wrap').style.display = (val === 'existing') ? 'block' : 'none';
  document.getElementById('nc-kit-new-wrap').style.display = (val === 'new') ? 'block' : 'none';
  if (val === 'existing') {
    const sel = document.getElementById('nc-kit-existing');
    sel.innerHTML = kits.length
      ? kits.map(k => `<option value="${k.id}">${escapeHtml(k.name)} (${k.id})</option>`).join('')
      : `<option value="">No kits yet — create one instead</option>`;
  }
}

function onPrefixChange() {
  const val = document.getElementById('nc-prefix').value;
  document.getElementById('nc-custom-wrap').style.display = (val === 'CUSTOM') ? 'block' : 'none';
  const furniture = ['FN', 'FB', 'FC', 'DR', 'SH'];
  pickShape('nc-shapes', furniture.includes(val) ? 'square' : 'circle');
}

function pickShape(containerId, shape) {
  const el = document.getElementById(containerId);
  el.dataset.selected = shape;
  [...el.querySelectorAll('.shape-pick')].forEach(s => s.classList.toggle('active', s.dataset.shape === shape));
}

function buildColorSwatches(containerId, activeColor) {
  const el = document.getElementById(containerId);
  el.innerHTML = PALETTE.map(c => `<div class="rv-swatch ${c === activeColor ? 'active' : ''}" data-color="${c}" style="background:${c}" onclick="pickColor('${containerId}','${c}')"></div>`).join('');
  el.dataset.selected = activeColor;
}
function pickColor(containerId, color) {
  const el = document.getElementById(containerId);
  el.dataset.selected = color;
  [...el.children].forEach(s => s.classList.toggle('active', s.dataset.color === color));
}

function svgPointFromEvent(evt) {
  const svg = document.getElementById('rd-svg');
  const pt = svg.createSVGPoint();
  const t = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
  pt.x = t.clientX; pt.y = t.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: Math.round(loc.x / SNAP) * SNAP, y: Math.round(loc.y / SNAP) * SNAP };
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function setContainerType(t) {
  containerType = t;
  document.getElementById('type-quick').classList.toggle('active', t === 'quick');
  document.getElementById('type-full').classList.toggle('active', t === 'full');
  document.getElementById('nc-prefix-wrap').style.display = (t === 'quick') ? 'block' : 'none';
  document.getElementById('nc-kit-section').style.display = (t === 'quick') ? 'block' : 'none';
  if (t === 'full') {
    document.getElementById('nc-kit-existing-wrap').style.display = 'none';
    document.getElementById('nc-kit-new-wrap').style.display = 'none';
  }
  document.getElementById('type-note').textContent = (t === 'quick')
    ? 'Lightweight — fill-level tracking only, no item enumeration. Saves instantly.'
    : 'Becomes a real inventory item. Goes to Cloud Run for review before it\u2019s fully committed — shows as pending until then.';
}

// ══════════════════════════════════════
// SAVE NEW CONTAINER
// ══════════════════════════════════════
async function saveNewContainer() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { HILShell.toast('Name is required', 'error'); return; }
  if (!pendingPlacePoint) { HILShell.toast('Placement point lost — tap the room again', 'error'); return; }

  const shape = document.getElementById('nc-shapes').dataset.selected || 'circle';
  const color = document.getElementById('nc-color').dataset.selected || PALETTE[0];
  const roomPosition = { x: pendingPlacePoint.x, y: pendingPlacePoint.y };
  const structCode = zone.struct_code;
  const hlStub = `${structCode}-${zoneCode}`;

  if (containerType === 'quick') {
    let prefix = document.getElementById('nc-prefix').value;
    if (prefix === 'CUSTOM') {
      prefix = document.getElementById('nc-custom-prefix').value.trim().toUpperCase();
      if (!/^[A-Z]{2,3}$/.test(prefix)) { HILShell.toast('Custom type code must be 2–3 letters', 'error'); return; }
    }
    const vesselId = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;

    // Resolve kit link BEFORE writing the vessel, so kit_id can go in the same write.
    const kitMode = document.getElementById('nc-kit-mode').value;
    let linkedKitId = null;
    let kitLabel = '';

    if (kitMode === 'existing') {
      linkedKitId = document.getElementById('nc-kit-existing').value || null;
      if (linkedKitId) {
        const kitRef = _doc(db, 'users', currentUser.uid, 'kits', linkedKitId);
        await _updateDoc(kitRef, { vessel_id: vesselId, hl_address: hlStub, updated_at: _serverTimestamp() });
        kitLabel = ' · linked to ' + linkedKitId;
      }
    } else if (kitMode === 'new') {
      const kitName = document.getElementById('nc-kit-name').value.trim();
      if (!kitName) { HILShell.toast('Kit name is required', 'error'); return; }
      const kitPrefix = document.getElementById('nc-kit-prefix').value;
      const kitDomain = document.getElementById('nc-kit-domain').value;
      const kitTier = parseInt(document.getElementById('nc-kit-tier').value, 10);
      const kitSlug = kitName.toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      linkedKitId = `${kitPrefix}-${kitSlug}`;
      const kitRef = _doc(db, 'users', currentUser.uid, 'kits', linkedKitId);
      await _setDoc(kitRef, {
        kit_id: linkedKitId, prefix: kitPrefix, name: kitName, domain: kitDomain, tier: kitTier,
        assumed_contents: [], special_items: [], missing_items: [],
        vessel_id: vesselId, hl_address: hlStub,
        capabilities: [], status: 'active',
        owner_uid: currentUser.uid, created_at: _serverTimestamp(), updated_at: _serverTimestamp(),
      });
      kitLabel = ' · new kit ' + linkedKitId;
    }

    const vesselRef = _doc(db, 'users', currentUser.uid, 'vessels', vesselId);
    await _setDoc(vesselRef, {
      vessel_id: vesselId, prefix, name,
      kit_id: linkedKitId,
      hl_address: hlStub, home_address: hlStub,
      fill_level: 'empty',
      shape, color,
      room_position: roomPosition, zone_code: zoneCode,
      containment: { parent_ref: null, path_ids: [] },
      owner_uid: currentUser.uid,
      created_at: _serverTimestamp(), updated_at: _serverTimestamp(),
    });
    HILShell.toast('Placed: ' + name + kitLabel, 'success');
  } else {
    await _addDoc(_collection(db, 'staged_items'), {
      owner_uid: currentUser.uid,
      name, is_container: true,
      shape, color,
      room_position: roomPosition, zone_code: zoneCode, struct_code: structCode,
      hl_address_partial: hlStub,
      status: 'pending_review',
      source_tool: 'room-visualizer',
      submitted_at: _serverTimestamp(),
    });
    HILShell.toast('Queued for review: ' + name, 'success');
  }

  pendingPlacePoint = null;
  closeModal('new-container-modal');
  setMode('view');
}

// ══════════════════════════════════════
// RENDER CONTAINERS ON CANVAS
// ══════════════════════════════════════
function renderContainers() {
  const layer = document.getElementById('containers-layer');
  layer.innerHTML = allContainers().map(c => {
    const pos = c.room_position || { x: 0, y: 0 };
    const isSelected = selectedId && selectedId.kind === c.kind && selectedId.id === c.id;
    const pendingClass = c.kind === 'pending' ? 'pending' : '';
    const fallbackColor = c.kind === 'pending' ? '#ffd84c' : (c.kind === 'committed' ? '#00cc66' : '#4a9eed');
    const color = c.color || fallbackColor;
    const shape = c.shape || 'circle';
    const initials = (c.name || '?').trim().slice(0, 2).toUpperCase();

    let shapeMarkup;
    if (shape === 'square') {
      shapeMarkup = `<rect x="${pos.x-15}" y="${pos.y-15}" width="30" height="30" fill="${color}"></rect>`;
    } else if (shape === 'triangle') {
      shapeMarkup = `<polygon points="${pos.x},${pos.y-17} ${pos.x-17},${pos.y+13} ${pos.x+17},${pos.y+13}" fill="${color}"></polygon>`;
    } else {
      shapeMarkup = `<circle cx="${pos.x}" cy="${pos.y}" r="16" fill="${color}"></circle>`;
    }

    return `
      <g class="rd-container-icon ${pendingClass} ${isSelected ? 'selected' : ''}"
        onmousedown="startDrag(event,'${c.kind}','${c.id}')"
        ontouchstart="startDrag(event,'${c.kind}','${c.id}')"
        onclick="selectContainer('${c.kind}','${c.id}', event)">
        ${shapeMarkup}
        <text x="${pos.x}" y="${pos.y + 4}">${initials}</text>
      </g>
    `;
  }).join('');
}

function findContainer(kind, id) {
  return allContainers().find(c => c.kind === kind && c.id === id);
}

// ══════════════════════════════════════
// SELECT / DRAG
// ══════════════════════════════════════
function selectContainer(kind, id, evt) {
  if (evt) evt.stopPropagation();
  if (mode === 'place') return;
  selectedId = { kind, id };
  const c = findContainer(kind, id);
  if (!c) { hideEditBlock(); return; }

  document.getElementById('edit-block').style.display = 'block';
  document.getElementById('edit-name').value = c.name + (kind === 'pending' ? '  (pending review)' : '');
  document.getElementById('edit-fill-wrap').style.display = (kind === 'vessel') ? 'block' : 'none';
  if (kind === 'vessel') document.getElementById('edit-fill').value = c.fill_level || 'empty';

  document.getElementById('edit-color-wrap').style.display = (kind === 'committed') ? 'none' : 'block';
  if (kind !== 'committed') buildColorSwatches('edit-color', c.color || '#4a9eed');

  // item_records aren't frontend-deletable — hide Delete for committed containers
  document.querySelector('#edit-block .rd-edit-actions .danger').style.display = (kind === 'committed') ? 'none' : 'block';

  const nestWrap = document.getElementById('edit-nest-toggle-wrap');
  const contentsBlock = document.getElementById('contents-block');

  if (kind === 'vessel') {
    nestWrap.style.display = 'flex';
    document.getElementById('edit-nest-toggle').checked = !!c.nesting_enabled;
    if (c.nesting_enabled) { contentsBlock.style.display = 'block'; openContentsFor(c); }
    else { contentsBlock.style.display = 'none'; unwatchChildren(); }
  } else if (kind === 'committed') {
    nestWrap.style.display = 'none';
    contentsBlock.style.display = 'block';
    openContentsFor(c);
  } else {
    nestWrap.style.display = 'none';
    contentsBlock.style.display = 'block';
    document.getElementById('contents-breadcrumb').innerHTML = '';
    document.getElementById('contents-list').innerHTML = '';
    document.getElementById('contents-add-area').innerHTML =
      `<div class="rd-locked-note">This item is still pending review — its contents can be tracked once it's committed.</div>`;
    unwatchChildren();
  }

  renderContainers();
  renderList();
}

function hideEditBlock() {
  document.getElementById('edit-block').style.display = 'none';
  unwatchChildren();
}

// ══════════════════════════════════════
// NESTED CONTENTS DRILL-DOWN
// ══════════════════════════════════════
async function toggleNesting(checked) {
  if (!selectedId || selectedId.kind !== 'vessel') return;
  const ref = _doc(db, 'users', currentUser.uid, 'vessels', selectedId.id);
  await _updateDoc(ref, { nesting_enabled: checked, updated_at: _serverTimestamp() });
  const c = findContainer('vessel', selectedId.id);
  if (c) c.nesting_enabled = checked;
  const contentsBlock = document.getElementById('contents-block');
  if (checked) { contentsBlock.style.display = 'block'; openContentsFor(c); }
  else { contentsBlock.style.display = 'none'; unwatchChildren(); }
}

function openContentsFor(container) {
  drillStack = [{ id: container.id, name: container.name }];
  watchChildren(container.id);
}

function unwatchChildren() {
  if (unsubChildrenCommitted) { unsubChildrenCommitted(); unsubChildrenCommitted = null; }
  if (unsubChildrenPending) { unsubChildrenPending(); unsubChildrenPending = null; }
  if (unsubChildrenVessels) { unsubChildrenVessels(); unsubChildrenVessels = null; }
  childrenCommitted = []; childrenPending = []; childrenVessels = []; drillStack = [];
}

function watchChildren(parentId) {
  if (unsubChildrenCommitted) unsubChildrenCommitted();
  if (unsubChildrenPending) unsubChildrenPending();
  if (unsubChildrenVessels) unsubChildrenVessels();

  const qc = _query(_collection(db, 'users', currentUser.uid, 'item_records'), _where('containment.parent_ref', '==', parentId));
  unsubChildrenCommitted = _onSnapshot(qc, snap => {
    childrenCommitted = snap.docs.map(d => ({ id: d.id, kind: 'committed', ...d.data() }));
    renderContentsList();
  }, () => {});

  const qp = _query(
    _collection(db, 'staged_items'),
    _where('owner_uid', '==', currentUser.uid),
    _where('containment.parent_ref', '==', parentId),
    _where('status', '==', 'pending_review')
  );
  unsubChildrenPending = _onSnapshot(qp, snap => {
    childrenPending = snap.docs.map(d => ({ id: d.id, kind: 'pending', ...d.data() }));
    renderContentsList();
  }, () => {});

  // Child vessels — a vessel nested inside another vessel (drawer inside a nightstand,
  // valet inside a drawer). Always frontend-writable, no staging needed, any depth.
  const qv = _query(_collection(db, 'users', currentUser.uid, 'vessels'), _where('containment.parent_ref', '==', parentId));
  unsubChildrenVessels = _onSnapshot(qv, snap => {
    childrenVessels = snap.docs.map(d => ({ id: d.id, kind: 'vessel', ...d.data() }));
    renderContentsList();
  }, () => {});
}

function renderContentsList() {
  const bc = document.getElementById('contents-breadcrumb');
  bc.innerHTML = drillStack.map((s, i) => {
    const isLast = i === drillStack.length - 1;
    return isLast ? escapeHtml(s.name) : `<a onclick="jumpToBreadcrumb(${i})">${escapeHtml(s.name)}</a> / `;
  }).join('');

  const list = [...childrenVessels, ...childrenCommitted, ...childrenPending];
  const listEl = document.getElementById('contents-list');
  listEl.innerHTML = list.length
    ? list.map(c => {
        // A vessel can always be drilled into — it's a container by definition.
        // A committed item only if it's explicitly flagged is_container.
        const canDrill = c.kind === 'vessel' || (c.kind === 'committed' && c.containment && c.containment.is_container);
        const dot = c.kind === 'pending' ? '#ffd84c' : c.kind === 'vessel' ? '#4a9eed' : (c.containment && c.containment.is_container ? '#00cc66' : '#8a6de0');
        const badge = c.kind === 'pending' ? 'PENDING' : c.kind === 'vessel' ? ('VESSEL' + (c.kit_id ? ' · KIT' : '')) : (c.containment && c.containment.is_container ? 'HOLDS ITEMS' : '');
        return `
          <div class="rd-child-row" onclick="${canDrill ? `drillInto('${c.kind}','${c.id}')` : ''}">
            <div class="rd-child-dot" style="background:${dot}"></div>
            <div class="rd-child-name">${escapeHtml(c.name)}</div>
            <div class="rd-child-badge">${badge}</div>
          </div>
        `;
      }).join('')
    : `<div class="rd-empty-panel" style="padding:10px 4px">Empty.</div>`;

  const parentId = drillStack[drillStack.length - 1].id;
  document.getElementById('contents-add-area').innerHTML = `
    <div class="rd-add-child-form">
      <input type="text" id="child-name-input" placeholder="Name">
      <select id="child-kind-select" onchange="onChildKindChange()">
        <option value="item">Item (tracked individually)</option>
        <option value="vessel">Vessel (can hold its own contents — drawer, valet, pouch)</option>
      </select>
      <div id="child-item-fields">
        <label><input type="checkbox" id="child-is-container"> Can hold other things (box, drawer, etc.)</label>
      </div>
      <div id="child-vessel-fields" style="display:none">
        <select id="child-vessel-prefix">
          <option value="MS">MS — Metal Shop Cart</option>
          <option value="SP">SP — Supply Container</option>
          <option value="BX">BX — Box</option>
          <option value="TB">TB — Tote Bin</option>
          <option value="BG">BG — Bag</option>
          <option value="SH">SH — Shelf Unit</option>
          <option value="DR">DR — Drawer / Dresser</option>
          <option value="FN">FN — Furniture, Surface</option>
          <option value="FB">FB — Furniture, Bed</option>
          <option value="FC">FC — Furniture, Seating</option>
          <option value="CUSTOM">Custom label…</option>
        </select>
        <input type="text" id="child-vessel-custom" maxlength="3" placeholder="Custom code (e.g. VT)" style="display:none;text-transform:uppercase;margin-top:6px">
      </div>
      <button class="rd-tool-btn" onclick="addChild('${parentId}')">＋ Add to Contents</button>
    </div>
  `;
}

function onChildKindChange() {
  const kind = document.getElementById('child-kind-select').value;
  document.getElementById('child-item-fields').style.display = (kind === 'item') ? 'block' : 'none';
  document.getElementById('child-vessel-fields').style.display = (kind === 'vessel') ? 'block' : 'none';
}

document.addEventListener('change', evt => {
  if (evt.target && evt.target.id === 'child-vessel-prefix') {
    document.getElementById('child-vessel-custom').style.display = (evt.target.value === 'CUSTOM') ? 'block' : 'none';
  }
});

function jumpToBreadcrumb(i) {
  drillStack = drillStack.slice(0, i + 1);
  watchChildren(drillStack[drillStack.length - 1].id);
}

function drillInto(kind, id) {
  const pool = kind === 'vessel' ? childrenVessels : childrenCommitted;
  const child = pool.find(c => c.id === id);
  if (!child) return;
  drillStack.push({ id, name: child.name });
  watchChildren(id);
}

async function addChild(parentId) {
  const name = document.getElementById('child-name-input').value.trim();
  const childKind = document.getElementById('child-kind-select').value;
  if (!name) { HILShell.toast('Name is required', 'error'); return; }

  const pathIds = drillStack.map(s => s.id);
  const hlStub = `${zone.struct_code}-${zoneCode}`;

  if (childKind === 'vessel') {
    let prefix = document.getElementById('child-vessel-prefix').value;
    if (prefix === 'CUSTOM') {
      prefix = document.getElementById('child-vessel-custom').value.trim().toUpperCase();
      if (!/^[A-Z]{2,3}$/.test(prefix)) { HILShell.toast('Custom type code must be 2–3 letters', 'error'); return; }
    }
    const vesselId = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
    const vesselRef = _doc(db, 'users', currentUser.uid, 'vessels', vesselId);
    await _setDoc(vesselRef, {
      vessel_id: vesselId, prefix, name,
      kit_id: null,
      hl_address: hlStub, home_address: hlStub,
      fill_level: 'empty',
      shape: 'circle', color: '#4a9eed',
      room_position: null, zone_code: zoneCode,   // no canvas icon — lives only inside its parent
      containment: { parent_ref: parentId, path_ids: pathIds },
      owner_uid: currentUser.uid,
      created_at: _serverTimestamp(), updated_at: _serverTimestamp(),
    });
    HILShell.toast('Nested vessel added: ' + name, 'success');
  } else {
    const isContainer = document.getElementById('child-is-container').checked;
    await _addDoc(_collection(db, 'staged_items'), {
      owner_uid: currentUser.uid,
      name,
      containment: { parent_ref: parentId, path_ids: pathIds, is_container: isContainer, child_count: 0 },
      zone_code: zoneCode, struct_code: zone.struct_code,
      status: 'pending_review',
      source_tool: 'room-visualizer',
      submitted_at: _serverTimestamp(),
    });
    HILShell.toast('Queued for review: ' + name, 'success');
  }
}

function startDrag(evt, kind, id) {
  evt.preventDefault();
  evt.stopPropagation();
  if (mode === 'place') return;
  draggingId = { kind, id };
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
}

function onDragMove(evt) {
  if (!draggingId) return;
  evt.preventDefault();
  const p = svgPointFromEvent(evt);
  const c = findContainer(draggingId.kind, draggingId.id);
  if (c) { c.room_position = p; renderContainers(); }
}

async function onDragEnd() {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  if (!draggingId) return;
  const c = findContainer(draggingId.kind, draggingId.id);
  draggingId = null;
  if (!c) return;

  if (c.kind === 'vessel') {
    const ref = _doc(db, 'users', currentUser.uid, 'vessels', c.id);
    await _updateDoc(ref, { room_position: c.room_position, updated_at: _serverTimestamp() });
  } else if (c.kind === 'committed') {
    // room_position is the one narrow frontend-writable field on item_records —
    // requires the matching Firestore rules exception to actually be in place.
    const ref = _doc(db, 'users', currentUser.uid, 'item_records', c.id);
    await _updateDoc(ref, { room_position: c.room_position });
  } else {
    const ref = _doc(db, 'staged_items', c.id);
    await _updateDoc(ref, { room_position: c.room_position });
  }
}

// ══════════════════════════════════════
// SIDE LIST
// ══════════════════════════════════════
function renderList() {
  const list = allContainers();
  document.getElementById('c-count').textContent = `(${list.length})`;
  const el = document.getElementById('c-list');
  if (!list.length) {
    el.innerHTML = `<div class="rd-empty-panel">Nothing placed yet.<br>Tap Add Container to start.</div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const sel = selectedId && selectedId.kind === c.kind && selectedId.id === c.id;
    const dot = c.kind === 'pending' ? '#ffd84c' : (c.kind === 'committed' ? '#00cc66' : '#4a9eed');
    const sub = c.kind === 'pending' ? 'PENDING REVIEW' : (c.kind === 'committed' ? 'CONTAINER · ITEM RECORD' : (c.prefix + ' · ' + (c.fill_level || 'empty').toUpperCase() + (c.kit_id ? ' · KIT: ' + c.kit_id : '')));
    return `
      <div class="rd-item-row ${sel ? 'selected' : ''}" onclick="selectContainer('${c.kind}','${c.id}')">
        <div class="rd-item-dot" style="background:${dot}"></div>
        <div class="rd-item-info">
          <div class="rd-item-name">${escapeHtml(c.name)}</div>
          <div class="rd-item-sub">${sub}</div>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ══════════════════════════════════════
// EDIT / DELETE
// ══════════════════════════════════════
async function saveFillLevel() {
  if (!selectedId) return;
  const color = document.getElementById('edit-color').dataset.selected;

  if (selectedId.kind === 'vessel') {
    const val = document.getElementById('edit-fill').value;
    const ref = _doc(db, 'users', currentUser.uid, 'vessels', selectedId.id);
    await _updateDoc(ref, { fill_level: val, color, updated_at: _serverTimestamp() });
  } else if (selectedId.kind === 'pending') {
    const ref = _doc(db, 'staged_items', selectedId.id);
    await _updateDoc(ref, { color });
  } else {
    return; // committed item_records: color isn't in the approved frontend-writable field set
  }
  HILShell.toast('Updated', 'success');
}

async function deleteContainer() {
  if (!selectedId) return;
  if (selectedId.kind === 'committed') { HILShell.toast('Item records can\u2019t be deleted from here', 'error'); return; }
  const c = findContainer(selectedId.kind, selectedId.id);
  if (!c) return;
  if (!confirm(`Remove "${c.name}" from this room?`)) return;

  if (selectedId.kind === 'vessel') {
    await _deleteDoc(_doc(db, 'users', currentUser.uid, 'vessels', selectedId.id));
  } else {
    await _deleteDoc(_doc(db, 'staged_items', selectedId.id));
  }
  selectedId = null;
  hideEditBlock();
  HILShell.toast('Removed', 'success');
}
</script>
