<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware ID — HIL System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0b;
    --panel:#12161a;
    --panel-2:#171c21;
    --border:#242b2f;
    --border-2:#33393d;
    --text:#e7ece9;
    --text-dim:#8b978f;
    --green:#00cc66;
    --green-ink:#05130c;
    --amber:#cc8800;
    --amber-ink:#160f00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Barlow Condensed',sans-serif;
    min-height:100vh; padding:18px 14px 44px; display:flex; justify-content:center;
  }
  .app{width:100%;max-width:540px;}
  /* ---- Header ---- */
  .hdr{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--green);padding-bottom:14px;margin-bottom:16px;}
  .hdr .logo{flex-shrink:0;}
  .hdr .titles{flex:1;}
  .hdr h1{
    margin:0;font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;
    letter-spacing:0.06em;text-transform:uppercase;color:var(--text);
  }
  .hdr .tag{font-size:12px;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase;margin-top:2px;font-weight:500;}
  /* ---- Mode tabs ---- */
  .mode-tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:16px;}
  .mode-tab{
    background:var(--panel);border:1.5px solid var(--border-2);color:var(--text-dim);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.06em;
    text-transform:uppercase;padding:10px 4px;border-radius:4px;cursor:pointer;
  }
  .mode-tab.active{background:var(--green);border-color:var(--green);color:var(--green-ink);}
  /* ---- Readout ---- */
  .readout{background:#000;border:1px solid var(--border-2);border-radius:6px;padding:14px 16px 10px;margin-bottom:18px;position:relative;overflow:hidden;}
  .readout::before,.readout::after{content:"";position:absolute;left:0;right:0;height:5px;background-image:repeating-linear-gradient(90deg,var(--border-2) 0 1px, transparent 1px 8px);opacity:0.5;}
  .readout::before{top:0;} .readout::after{bottom:0;}
  .readout .label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:0.18em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px;font-weight:600;}
  .readout .screen{
    background:#050706;border:1px solid var(--border-2);border-radius:3px;padding:12px 10px;min-height:34px;
    display:flex;align-items:center;font-family:'Space Mono',monospace;font-size:16px;letter-spacing:0.02em;
    color:var(--green);text-shadow:0 0 8px rgba(0,204,102,0.35);overflow-x:auto;white-space:nowrap;
  }
  .readout .screen .ph{color:#1c3d2c;}
  /* ---- Cards ---- */
  .card{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:18px 16px;margin-bottom:14px;}
  .step-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.16em;color:var(--amber);text-transform:uppercase;font-weight:700;margin-bottom:10px;}
  .question{font-size:19px;font-weight:600;margin:0 0 4px;line-height:1.25;}
  .hint{font-size:14px;color:var(--text-dim);margin:0 0 14px;line-height:1.4;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);}
  .field label .opt{font-weight:400;text-transform:none;letter-spacing:0;color:#5c655f;}
  .field input[type=number],.field input[type=text]{
    width:100%;padding:11px;font-size:17px;border:1.5px solid var(--border-2);border-radius:5px;
    background:#05070a;color:var(--green);font-family:'Space Mono',monospace;
  }
  .field input[type=number]:focus,.field input[type=text]:focus{outline:none;border-color:var(--green);}
  .unit-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .unit-btn{flex:1;background:var(--panel-2);border:1.5px solid var(--border-2);border-radius:4px;padding:9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);}
  .unit-btn.selected{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt-grid.wide{grid-template-columns:1fr;}
  .opt-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .opt-grid.four{grid-template-columns:1fr 1fr 1fr 1fr;}
  .opt-btn{
    background:var(--panel-2);border:1.5px solid var(--border-2);border-radius:5px;padding:11px 10px;
    font-size:15px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;line-height:1.25;
    font-family:'Barlow Condensed',sans-serif;
  }
  .opt-btn small{display:block;font-weight:400;color:var(--text-dim);font-size:12px;margin-top:2px;}
  .opt-btn.selected{background:var(--green);border-color:var(--green);color:var(--green-ink);}
  .opt-btn.selected small{color:#0a2e1c;}
  .toggle-link{background:none;border:none;color:var(--amber);font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:12px;display:inline-block;font-family:'Barlow Condensed',sans-serif;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}
  .btn{border:none;border-radius:5px;padding:12px 18px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;font-family:'Barlow Condensed',sans-serif;}
  .btn-back{background:transparent;color:var(--text-dim);border:1.5px solid var(--border-2);}
  .btn-next{background:var(--green);color:var(--green-ink);}
  .btn-next:disabled{background:#2b3530;color:#5c655f;cursor:not-allowed;}
  .btn-restart{background:var(--amber);color:var(--amber-ink);}
  .progress{display:flex;gap:4px;margin-bottom:14px;}
  .progress i{flex:1;height:4px;border-radius:2px;background:var(--border-2);}
  .progress i.done{background:var(--amber);}
  .progress i.now{background:var(--green);}
  /* ---- Result / matches ---- */
  .result-designation{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;line-height:1.35;margin:4px 0 10px;color:var(--green);}
  .result-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stub-label{background:#05070a;border:2px solid var(--green);border-radius:2px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;color:var(--green);}
  .stub-label span{display:block;font-size:9.5px;font-weight:400;color:var(--text-dim);letter-spacing:0.06em;font-family:'Barlow Condensed',sans-serif;}
  .confidence{font-size:13px;color:var(--text-dim);background:var(--panel-2);border-radius:4px;padding:9px 11px;line-height:1.4;margin-bottom:14px;}
  .match-item{border:1.5px solid var(--border-2);border-radius:5px;padding:12px;margin-bottom:10px;background:var(--panel-2);}
  .match-item.best{border-color:var(--green);border-width:2px;}
  .match-title{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;margin-bottom:3px;color:var(--text);}
  .match-meta{font-size:13px;color:var(--text-dim);}
  .match-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;background:var(--green);color:var(--green-ink);padding:2px 7px;border-radius:3px;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif;}
  .empty-state{font-size:14px;color:var(--text-dim);text-align:center;padding:10px 0;}
  .label-export{border-top:1px dashed var(--border-2);padding-top:14px;margin-top:4px;}
  .size-btn{font-size:14px;padding:11px 6px;text-align:center;}
  .footer-note{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:12px;line-height:1.5;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--amber);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;font-family:'Barlow Condensed',sans-serif;}
  td{font-family:'Space Mono',monospace;color:var(--text);font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .ref-section{margin-bottom:22px;}
  .ref-section h2{font-family:'Orbitron',sans-serif;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:0.04em;margin:0 0 10px;color:var(--green);border-bottom:1px solid var(--border);padding-bottom:6px;}
  /* ---- Bin Log block (Find/Create Bin — Vault fill_level logging) ---- */
  .bin-log{border-top:1px dashed var(--border-2);padding-top:14px;margin-top:4px;}
  .bin-signin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .bin-match-row{border:1.5px solid var(--border-2);border-radius:5px;padding:10px 12px;margin-bottom:8px;background:var(--panel-2);}
  .bin-match-name{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;color:var(--text);}
  .bin-match-meta{font-size:12px;color:var(--text-dim);margin-top:1px;margin-bottom:8px;}
  .fill-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  .fill-btn{
    border:1.5px solid var(--border-2);border-radius:4px;padding:8px 4px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;background:var(--panel);color:var(--text);
    font-family:'Barlow Condensed',sans-serif;
  }
  .fill-btn.is-full{color:var(--green);} .fill-btn.is-full.current{background:var(--green);color:var(--green-ink);border-color:var(--green);}
  .fill-btn.is-medium{color:var(--text);} .fill-btn.is-medium.current{background:var(--text-dim);color:var(--bg);border-color:var(--text-dim);}
  .fill-btn.is-low{color:var(--amber);} .fill-btn.is-low.current{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
  .fill-btn.is-empty{color:#e05d5d;} .fill-btn.is-empty.current{background:#e05d5d;color:#160303;border-color:#e05d5d;}
  .bin-create{border-top:1px solid var(--border);padding-top:12px;margin-top:4px;}
</style>
</head>
<body>
<!-- HIL SHELL — canonical source of truth: Firebase init, auth, header/nav, design tokens, toast system -->
<script src="hil-shell.js"></script>
<div class="app">
  <div class="hdr">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="42" height="42">
        <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="none" stroke="#00cc66" stroke-width="4"/>
        <circle cx="50" cy="50" r="27" fill="none" stroke="#cc8800" stroke-width="2"/>
        <line x1="50" y1="16" x2="50" y2="29" stroke="#00cc66" stroke-width="3"/>
        <line x1="50" y1="71" x2="50" y2="84" stroke="#00cc66" stroke-width="3" opacity="0.45"/>
        <line x1="16" y1="50" x2="29" y2="50" stroke="#00cc66" stroke-width="3" opacity="0.45"/>
        <line x1="71" y1="50" x2="84" y2="50" stroke="#00cc66" stroke-width="3" opacity="0.45"/>
        <polygon points="50,36 58,50 50,64 42,50" fill="#cc8800"/>
      </svg>
    </div>
    <div class="titles">
      <h1>Hardware ID</h1>
      <div class="tag">Efficiency Engine — Reverse Lookup</div>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabScrew" onclick="setMode('screw')">Screw</button>
    <button class="mode-tab" id="tabWasher" onclick="setMode('washer')">Washer</button>
    <button class="mode-tab" id="tabNut" onclick="setMode('nut')">Nut</button>
    <button class="mode-tab" id="tabRef" onclick="setMode('reference')">Reference</button>
  </div>
  <div id="screenWrap">
    <div class="readout">
      <div class="label" id="readoutLabel">Building designation</div>
      <div class="screen" id="screen"><span class="ph">— — — — — —</span></div>
    </div>
  </div>
  <div class="progress" id="progress"></div>
  <div id="content"></div>
  <div class="footer-note" id="footerNote">Matches are nearest-standard estimates from observed dimensions — verify with a thread gauge or drill index when precision matters.</div>
</div>
<script>
/* =================================================================
   SHARED: material list + label PNG export (single source, per spec)
   ================================================================= */
const MATERIALS = ["Zinc-Plated Steel","Stainless Steel","Brass","Black Oxide","Coated / Exterior","Nylon","Unknown"];
let material = null;
function generateLabelPNG(widthMM, heightMM, mainText, subText, extraText){
  const dpi = 300;
  const w = Math.round(widthMM/25.4*dpi), h = Math.round(heightMM/25.4*dpi);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  const border = Math.max(2, Math.round(w*0.012));
  ctx.strokeStyle = '#000'; ctx.lineWidth = border;
  ctx.strokeRect(border/2, border/2, w-border, h-border);
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fontSize = Math.round(h*0.30);
  ctx.font = `700 ${fontSize}px "Courier New", monospace`;
  while(ctx.measureText(mainText).width > w*0.88 && fontSize > 10){ fontSize -= 2; ctx.font = `700 ${fontSize}px "Courier New", monospace`; }
  ctx.fillText(mainText, w/2, h*0.36);
  const sub = subText + (material ? ' · ' + material.toUpperCase() : '');
  let subSize = Math.round(h*0.12);
  ctx.font = `600 ${subSize}px Arial, sans-serif`;
  while(ctx.measureText(sub).width > w*0.9 && subSize > 8){ subSize -= 1; ctx.font = `600 ${subSize}px Arial, sans-serif`; }
  ctx.fillText(sub, w/2, h*0.60);
  if(extraText){
    ctx.font = `600 ${Math.round(subSize*0.85)}px Arial, sans-serif`;
    ctx.fillText(extraText, w/2, h*0.78);
  }
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'label-' + mainText.replace(/[^a-z0-9]/gi,'_') + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function renderMaterialPicker(container, onChange){
  const grid = document.createElement('div');
  grid.className = 'opt-grid';
  MATERIALS.forEach(m=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (material===m ? ' selected' : '');
    b.textContent = m;
    b.onclick = ()=>{
      material = (material===m ? null : m);
      onChange();
    };
    grid.appendChild(b);
  });
  container.appendChild(grid);
}
function labelExportBlock(container, getBest){
  const box = el('div','label-export');
  box.appendChild(el('div','step-meta','Print Label'));
  box.appendChild(el('p','hint','Downloads a PNG for RLabel / Katasymbol — import as an image, then print.'));
  const grid = el('div','opt-grid three');
  [[30,14],[40,20],[50,30]].forEach(([w,h])=>{
    const b = el('button','opt-btn size-btn', `${w} × ${h}mm`);
    b.onclick = ()=>{ const best = getBest(); generateLabelPNG(w,h,best.main,best.sub,best.extra); };
    grid.appendChild(b);
  });
  box.appendChild(grid);
  container.appendChild(box);
}
/* small DOM helper — build with appendChild only, never re-stringify
   a container after interactive children are attached */
function el(tag, className, html){
  const e = document.createElement(tag);
  if(className) e.className = className;
  if(html!=null) e.innerHTML = html;
  return e;
}
function addQuestion(card,text){ card.appendChild(el('p','question',text)); }
function addHint(card,text){ card.appendChild(el('p','hint',text)); }
/* =================================================================
   BIN LOG — Find/Create Bin (Vault vessel fill_level logging)
   Reuses the same in-memory allVessels filter pattern hl-vault-cloud.html
   uses for Related Items / vessel parent search. No per-fastener records —
   this only ever touches a vessel's name/hl_address/fill_level fields.

   EFFICIENCY PASS (same day as the prefix fix below):
   - renderBinLogBlock() used to be torn down and fully rebuilt by the
     SAME renderAll() the rest of the mode uses, on every keystroke in its
     own search/name/address fields. Since those fields live inside the
     rebuilt subtree, every character typed destroyed and recreated the
     input element itself — which drops keyboard focus, so typing more
     than one character required clicking back into the field each time.
     Fixed below: the search/name/address inputs are now built once and
     never torn down by typing in them. The search field's own oninput
     only repaints the match list in a dedicated sub-container (matchesEl)
     instead of the whole card; the name/address fields don't need to
     repaint anything at all on input — they just record state, since
     nothing else on screen depends on their value until a fill button
     is actually tapped.
   ================================================================= */
let vaultUser = null;           // set once Shell auth resolves; null = signed out
let allVessels = [];            // live mirror of users/{uid}/vessels — scoped, see handleAuth
let _collection, _doc, _addDoc, _updateDoc, _serverTimestamp, _query, _where; // Firestore modular SDK fns
const FILL_LEVELS = [["full","Full"],["medium","Medium"],["low","Low"],["empty","Empty"]];
let binDraft = { name:'', vesselId:'', hlAddr:'' };
let binDraftAutoName = '';   // tracks the last auto-suggested name so typed edits aren't clobbered
let binSearch = '';
function resetBinDraft(){
  binDraft = { name:'', vesselId:'', hlAddr:'' };
  binDraftAutoName = '';
  binSearch = '';
}
function suggestVesselId(name){
  const slug = (name||'BIN').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,18);
  const suffix = Date.now().toString(36).toUpperCase().slice(-4);
  return (slug||'BIN') + '-' + suffix;
}
function binMatches(query){
  const q = (query||'').trim().toLowerCase();
  const pool = q
    ? allVessels.filter(v => (v.name||'').toLowerCase().includes(q) || (v.vessel_id||'').toLowerCase().includes(q))
    : allVessels.slice();
  return pool.slice(0, 8);
}
async function setVesselFillLevel(vesselId, level){
  try{
    await _updateDoc(_doc(window.db, 'users', vaultUser.uid, 'vessels', vesselId),
      { fill_level: level, updated_at: _serverTimestamp() });
    HILShell.toast('Bin updated — ' + level.toUpperCase());
  }catch(err){ HILShell.toast('Update failed: ' + err.message, 'error'); }
}
async function createVesselAndLog(level){
  const name = (binDraft.name||'').trim();
  if(!name){ HILShell.toast('Bin name required', 'error'); return; }
  const vesselId = (binDraft.vesselId||'').trim() || suggestVesselId(name);
  const hlAddr = (binDraft.hlAddr||'').trim() || null;
  const now = _serverTimestamp();
  const data = {
    vessel_id: vesselId,
    // PREFIX FIX (same day): this was hardcoded to 'MS' ("Metal Shop Cart"
    // in the Vessel Registry — see HIL PLATFORM FIRESTORE SCHEMA v1.5 §8),
    // which is the wrong prefix for a fastener/hardware bin regardless of
    // what the bin actually holds. 'SP' (Supply Container) is the correct
    // semantic fit for small-parts storage. Existing bins created before
    // this fix still carry 'MS' — see the scoped query note in handleAuth()
    // below for how both are still found by search.
    prefix: 'SP', name,
    hl_address: hlAddr, home_address: null,
    kit_id: null, fill_level: level,
    vessel_type_id: null, parent_ref: null, slot_position: null,
    slot_mode: null, freeform_contents: null, slot_count: null, slots: null,
    tags: [],
    owner_uid: vaultUser.uid, created_at: now, updated_at: now,
  };
  try{
    await _addDoc(_collection(window.db, 'users', vaultUser.uid, 'vessels'), data);
    HILShell.toast('Bin created ✓ — ' + level.toUpperCase());
    resetBinDraft();
    renderAll();
  }catch(err){ HILShell.toast('Create failed: ' + err.message, 'error'); }
}
function triggerShellAuth(){
  // hil-shell.js always builds #hil-auth-gate (v2.5+) — this opens the real
  // Google/GitHub/Email sign-in modal, same one Vault and Exchange use.
  const gate = document.getElementById('hil-auth-gate');
  if(gate){ gate.classList.remove('hidden'); return; }
  HILShell.toast('Sign-in isn\'t ready yet — try again in a moment', 'error');
}
function fillButtonRow(onPick, currentLevel){
  const row = el('div','fill-row');
  FILL_LEVELS.forEach(([key,label])=>{
    const b = el('button','fill-btn is-'+key+(currentLevel===key?' current':''), label);
    b.onclick = ()=> onPick(key);
    row.appendChild(b);
  });
  return row;
}
// designation: the computed bin label/search seed for the current result
// (e.g. "#8-32" screw bin label, "WASHER 1/4\"", "NUT 3/8-16")
function renderBinLogBlock(container, designation){
  const box = el('div','card bin-log');
  box.appendChild(el('div','step-meta','Log To Vault Bin'));
  box.appendChild(el('p','hint','Find the bin this lives in and set its fill level — no per-fastener records, just the bin.'));
  if(!vaultUser){
    const row = el('div','bin-signin-row');
    row.appendChild(el('span','hint','Sign in to search or create a Vault bin.'));
    const btn = el('button','btn btn-next','Sign In →');
    btn.onclick = triggerShellAuth;
    row.appendChild(btn);
    row.querySelector('.hint').style.margin = '0';
    box.appendChild(row);
    container.appendChild(box);
    return;
  }
  // Keep the search field's auto-fill in sync with the current designation
  // unless the person has already typed something of their own.
  if(designation && (binSearch === '' || binSearch === binDraftAutoName)){
    binSearch = designation;
  }
  if(designation && (binDraft.name === '' || binDraft.name === binDraftAutoName)){
    binDraft.name = designation;
  }
  binDraftAutoName = designation || binDraftAutoName;
  const searchField = el('div','field', `<label>Search bins</label><input type="text" id="bin-search-input" placeholder="Bin name or ID" value="${binSearch.replace(/"/g,'&quot;')}">`);
  box.appendChild(searchField);
  // Dedicated container for the match list — this is the ONLY part that
  // repaints as you type in the search box. The <input> itself is never
  // rebuilt, so it keeps keyboard focus and cursor position character to
  // character (see the efficiency-pass note above the state block).

function screwSteps(fam){

function gcd(a,b){return b?gcd(b,a%b):a;}
function toFraction16(decIn){
  let whole = Math.floor(decIn);

  if(sixteenths===16){sixteenths=0;whole+=1;}
  if(sixteenths===0) return whole+'"';
  const g = gcd(sixteenths,16);
  return (whole? whole+'-':'') + (sixteenths/g)+'/'+(16/g)+'"';

function nearestGauge(decIn){

  return best;
}
function nearestMetric(mm){

  USS_W.forEach(([fits,id,od,thk])=> list.push({series:'USS (Wide)',fits,idIn:id,odIn:od,thkIn:thk}));

  METRIC_W.forEach(([fits,idmm,odmm,thkmm])=> list.push({series:'Metric DIN 125',fits,idIn:wMmToIn(idmm),odIn:wMmToIn(odmm),thkIn:wMmToIn(thkmm)}));
  return list;
}
function wTopMatches(m,n){
  return wAllEntries().map(e=>{
    const dOd=(m.odIn-e.odIn), dId=(m.idIn-e.idIn), dThk=(m.thkIn-e.thkIn);
    return {...e, dist:Math.sqrt(dOd*dOd*2.5 + dId*dId*2.5 + dThk*dThk)};
  }).sort((a,b)=>a.dist-b.dist).slice(0,n);
}

    const closeness = e.dist < 0.015 ? 'Close match' : e.dist < 0.05 ? 'Approximate' : 'Rough match';
    const div = el('div','match-item'+(i===0?' best':''), `
      <div class="match-badge">${i===0?'Best match':closeness}</div>
      <div class="match-title">${e.series} — ${e.fits}</div>
      <div class="match-meta">AF ${wFmt(e.afIn)} · Height ${wFmt(e.hIn)} · Thread ≈ ${wFmt(e.diaIn)}${material? ' · '+material:''}</div>
    `);
    card3.appendChild(div);
  });
  labelExportBlock(card3, ()=>({main:'NUT '+matches[0].fits, sub:matches[0].series, extra:`AF ${wFmt(matches[0].afIn)}  H ${wFmt(matches[0].hIn)}`}));
  renderBinLogBlock(content, 'NUT ' + matches[0].fits);
}
function nReadMeasurements(){
  const afRaw = parseFloat(nVals.af), hRaw = parseFloat(nVals.h), boreRaw = parseFloat(nVals.bore);
  if(isNaN(afRaw)||isNaN(hRaw)) return null;
  const toIn = v => nUnit==='in' ? v : wMmToIn(v);
  return {afIn:toIn(afRaw), hIn:toIn(hRaw), boreIn:isNaN(boreRaw)?null:toIn(boreRaw), afRaw, hRaw, boreRaw:isNaN(boreRaw)?null:boreRaw};
}
function nAllEntries(){
  const list = [];
  UNC_NUTS.forEach(([fits,af,h,dia])=> list.push({series:'UNC (Imperial)',fits,afIn:af,hIn:h,diaIn:dia}));
  METRIC_NUTS.forEach(([fits,af,h,dia])=> list.push({series:'Metric DIN 934',fits,afIn:wMmToIn(af),hIn:wMmToIn(h),diaIn:wMmToIn(dia)}));
  return list;
}
function nTopMatches(m,n){
  return nAllEntries().map(e=>{
    const dAf=(m.afIn-e.afIn), dH=(m.hIn-e.hIn);
    let d = dAf*dAf*3.0 + dH*dH*1.5;
    if(m.boreIn!=null){ const dBore=(m.boreIn-e.diaIn); d += dBore*dBore*0.8; }
    return {...e, dist:Math.sqrt(d)};
  }).sort((a,b)=>a.dist-b.dist).slice(0,n);
}

/* =================================================================
   SHELL INIT — public browse (ID wizard needs no auth), sign-in only
   required to act on the Find/Create Bin step. Same requireAuth:false
   pattern as hil-exchange.html.
   ================================================================= */
async function handleAuth(user){
  if(!user){
    vaultUser = null; allVessels = [];
    renderAll();
    return;
  }
  vaultUser = user;
  const FB_VER  = '10.12.0';
  const FB_BASE = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const fsdk = await import(`${FB_BASE}/firebase-firestore.js`);
  _collection      = fsdk.collection;
  _doc             = fsdk.doc;
  _addDoc          = fsdk.addDoc;
  _updateDoc       = fsdk.updateDoc;
  _serverTimestamp = fsdk.serverTimestamp;
  _query           = fsdk.query;
  _where           = fsdk.where;
  // EFFICIENCY FIX (same day as the prefix fix above): this used to
  // subscribe to the ENTIRE vessels collection — furniture, tool chests,
  // racks, everything — just to filter it client-side down to fastener
  // bins for search. This tool never needs to see anything but those, so
  // it now scopes the query to prefix in ['SP','MS']: 'SP' is what this
  // tool writes going forward (see the prefix fix in createVesselAndLog),
  // 'MS' is kept in the query because every bin this tool has EVER created
  // up to today used that prefix — dropping it here would silently hide
  // every existing hardware bin from search until each one is individually
  // re-saved. Assumption worth flagging: if fastener/hardware bins have
  // ever been created directly through Vault's own Add Vessel modal with
  // a different prefix, this scoped query won't surface those — widen the
  // 'in' list (or better, key off a dedicated tag instead of prefix) if
  // that turns out to be the case.
  const binsQuery = _query(
    _collection(window.db, 'users', user.uid, 'vessels'),
    _where('prefix', 'in', ['SP', 'MS'])
  );
  fsdk.onSnapshot(binsQuery, snap => {
    allVessels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  }, err => HILShell.toast('Vessel load error: ' + err.message, 'error'));
}
if(typeof HILShell === 'undefined'){
  console.error('HILShell not found — hil-shell.js failed to load or is missing from this deploy path.');
} else {
  HILShell.init({
    toolId:      'hardware-id',
    toolName:    'Hardware ID',
    requireAuth: false,
    onAuth:      handleAuth,
  });
}
