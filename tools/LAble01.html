<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Large-Text Spine Label Generator</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #1a1a1a; color: #eee; padding: 20px; display: flex; gap: 24px; }
  .controls { width: 340px; background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #444; }
  .preview-panel { flex-grow: 1; background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  label { display: block; font-size: 11px; font-weight: bold; margin-top: 12px; text-transform: uppercase; color: #aaa; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; background: #111; border: 1px solid #555; color: #fff; border-radius: 4px; }
  .btn-row { margin-top: 20px; display: flex; gap: 10px; }
  button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-svg { background: #2563eb; color: white; }
  .btn-png { background: #16a34a; color: white; }
  #svgContainer { background: #444; padding: 24px; border-radius: 6px; }
  svg { display: block; }
</style>
</head>
<body>

<div class="controls">
  <h3 style="margin-top:0;">2-Line High-Visibility Label</h3>
  
  <label>Label Size (mm)</label>
  <div style="display:flex; gap:8px;">
    <input type="number" id="lblWidth" value="40" title="Width (mm)">
    <input type="number" id="lblHeight" value="14" title="Height (mm)">
  </div>

  <label>Kit ID (Header)</label>
  <input type="text" id="txtId" value="KIT-FAST-M3-SS">

  <label>Description / Contents</label>
  <input type="text" id="txtDesc" value="M3 Socket Head Screws & Nuts">

  <label>Drive / Hardware Symbol</label>
  <select id="shapeBadge">
    <option value="HEX" selected>Hex Socket (Hexagon)</option>
    <option value="PHILLIPS">Phillips / Cross (+)</option>
    <option value="TORX">Torx / Star (★)</option>
    <option value="SLOTTED">Slotted / Flathead (―)</option>
    <option value="ELEC">Bolt / Lightning (⚡)</option>
    <option value="NONE">None (Full Width Text)</option>
  </select>

  <div class="btn-row">
    <button class="btn-svg" onclick="downloadSVG()">Save SVG</button>
    <button class="btn-png" onclick="downloadPNG()">Export PNG</button>
  </div>
</div>

<div class="preview-panel">
  <div id="svgContainer"></div>
</div>

<script>
const DPI = 8; // 203 DPI standard (~8 dots/mm)

function renderLabel() {
  const wMm = parseFloat(document.getElementById('lblWidth').value) || 40;
  const hMm = parseFloat(document.getElementById('lblHeight').value) || 14;
  const width = wMm * DPI;
  const height = hMm * DPI;

  const id = document.getElementById('txtId').value;
  const desc = document.getElementById('txtDesc').value;
  const shape = document.getElementById('shapeBadge').value;

  const padLeft = 8;
  const padRight = 6;
  
  // Icon Layout (Centered vertically across full height)
  const iconSize = shape === 'NONE' ? 0 : height * 0.70;
  const cx = width - padRight - (iconSize / 2);
  const cy = height / 2;
  const r = iconSize / 2;

  let shapeMarkup = '';
  if (shape === 'HEX') {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const angle = (i * 60 - 30) * Math.PI / 180;
      pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
    }
    shapeMarkup = `<polygon points="${pts.join(' ')}" fill="#000000"/>`;
  } else if (shape === 'PHILLIPS') {
    const sw = height * 0.12;
    shapeMarkup = `
      <line x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}" stroke="#000000" stroke-width="${sw}" stroke-linecap="square"/>
      <line x1="${cx}" y1="${cy - r}" x2="${cx}" y2="${cy + r}" stroke="#000000" stroke-width="${sw}" stroke-linecap="square"/>
    `;
  } else if (shape === 'TORX') {
    shapeMarkup = `<text x="${cx}" y="${cy + r * 0.78}" font-size="${r * 2.3}" font-family="Arial, sans-serif" font-weight="900" fill="#000000" text-anchor="middle">★</text>`;
  } else if (shape === 'SLOTTED') {
    const sw = height * 0.14;
    shapeMarkup = `<line x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}" stroke="#000000" stroke-width="${sw}" stroke-linecap="square"/>`;
  } else if (shape === 'ELEC') {
    shapeMarkup = `<polygon points="${cx-2},${cy-r} ${cx+r},${cy-2} ${cx},${cy} ${cx+3},${cy+r} ${cx-r},${cy+2} ${cx-1},${cy}" fill="#000000"/>`;
  }

  // Available text width before hitting the icon
  const maxTextWidth = shape === 'NONE' ? (width - padLeft - padRight) : (cx - r - padLeft - 6);

  const svgContent = `
    <svg id="labelSvg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <!-- White Base -->
      <rect width="${width}" height="${height}" fill="#ffffff"/>
      
      <!-- Right Side Drive/Hardware Symbol -->
      ${shapeMarkup}

      <!-- Top Row: Extra Bold Large ID -->
      <text x="${padLeft}" y="${height * 0.46}" font-size="${height * 0.40}" font-family="Arial, Helvetica, sans-serif" font-weight="900" fill="#000000" textLength="${maxTextWidth}" lengthAdjust="spacingAndGlyphs">${escapeXml(id)}</text>
      
      <!-- Bottom Row: Large Clean Description -->
      <text x="${padLeft}" y="${height * 0.86}" font-size="${height * 0.28}" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#000000" textLength="${maxTextWidth}" lengthAdjust="spacingAndGlyphs">${escapeXml(desc)}</text>
    </svg>
  `;

  document.getElementById('svgContainer').innerHTML = svgContent;
}

function escapeXml(str) {
  return str.replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','\'':'&apos;','"':'&quot;'}[c]));
}

function downloadSVG() {
  const svgEl = document.getElementById('labelSvg');
  const serializer = new XMLSerializer();
  const source = serializer.serializeToString(svgEl);
  const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
  triggerDownload(URL.createObjectURL(blob), `${document.getElementById('txtId').value || 'label'}.svg`);
}

function downloadPNG() {
  const svgEl = document.getElementById('labelSvg');
  const serializer = new XMLSerializer();
  const source = serializer.serializeToString(svgEl);
  const img = new Image();
  const svgBlob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);

  img.onload = function() {
    const canvas = document.createElement("canvas");
    canvas.width = svgEl.getAttribute('width');
    canvas.height = svgEl.getAttribute('height');
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    triggerDownload(canvas.toDataURL("image/png"), `${document.getElementById('txtId').value || 'label'}.png`);
  };
  img.src = url;
}

function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.querySelectorAll('.controls input, .controls select').forEach(el => {
  el.addEventListener('input', renderLabel);
});

renderLabel();
</script>
</body>
</html>
