<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar &amp; Battery Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../hil-shell.js"></script>
<style>
  /* Design tokens come from hil-shell.js's injectStyles() — no duplicate
     :root block here. --solar/--batt are genuinely module-specific accent
     colors (not platform tokens) so they stay declared locally. */
  :root{ --solar:#ff9f5a; --batt:#5fd68a; }
  *{box-sizing:border-box;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 50px;}
  header.moduleheader{border-bottom:2px solid var(--hil-border);padding-bottom:12px;margin-bottom:16px;}
  h1{font-family:var(--font-display);font-weight:900;font-size:28px;letter-spacing:0.04em;margin:0;}
  h1 span{color:var(--solar);}
  .subtitle{font-family:var(--font-mono);font-size:12px;color:var(--hil-text-muted);letter-spacing:0.5px;text-transform:uppercase;}

  .stage{position:relative;border:1px solid var(--hil-border);border-radius:4px;overflow:hidden;background:#0a0c0b;}
  canvas{display:block;width:100%;height:auto;}

  .panel{background:var(--hil-surface);border:1px solid var(--hil-border);border-radius:4px;padding:16px 18px;margin-top:14px;}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:600px){.controls{grid-template-columns:1fr;}}
  .field label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--hil-text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .field label b{color:var(--hil-text);font-size:14px;}
  input[type=range]{width:100%;accent-color:var(--solar);}
  select{width:100%;background:#1c201e;border:1px solid var(--hil-border);color:var(--hil-text);font-family:var(--font-mono);padding:7px 8px;border-radius:3px;font-size:13px;}

  .presets{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .presets button{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;background:transparent;border:1px solid var(--hil-border);color:var(--hil-text-muted);padding:5px 10px;border-radius:3px;cursor:pointer;}
  .presets button.active{border-color:var(--hil-text);color:var(--hil-text);}

  .togglegroup{display:flex;gap:8px;}
  .togglegroup button{flex:1;font-family:var(--font-ui);font-size:17px;font-weight:600;background:#1c201e;border:1px solid var(--hil-border);color:var(--hil-text-muted);padding:8px;border-radius:4px;cursor:pointer;}
  .togglegroup button.active{border-color:var(--solar);color:var(--solar);background:rgba(255,159,90,0.08);}

  .battbar{margin-top:16px;background:#0a0c0b;border:1px solid var(--hil-border);border-radius:4px;height:34px;position:relative;overflow:hidden;}
  .battfill{height:100%;transition:width 0.2s ease;}
  .battlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:18px;font-weight:600;color:#0c1510;}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  @media (max-width:600px){.summary{grid-template-columns:1fr;}}
  .scard{background:#1c201e;border:1px solid var(--hil-border);border-radius:4px;padding:12px 14px;text-align:center;}
  .scard .lbl{font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .scard .val{font-family:var(--font-ui);font-size:26px;font-weight:600;}

  .status{margin-top:14px;padding:10px 14px;border-radius:4px;font-size:13.5px;line-height:1.6;}
  .status.good{background:rgba(73,199,141,0.12);color:var(--hil-green);border:1px solid rgba(73,199,141,0.4);}
  .status.warn{background:rgba(255,201,60,0.12);color:var(--hil-amber);border:1px solid rgba(255,201,60,0.4);}
  .status.bad{background:rgba(255,93,93,0.12);color:var(--hil-danger);border:1px solid rgba(255,93,93,0.4);}
  .status .sub{display:block;font-family:var(--font-mono);font-size:11.5px;margin-top:3px;opacity:0.85;}

  .formula{margin-top:14px;font-family:var(--font-mono);font-size:12.5px;line-height:1.9;border-left:2px solid var(--solar);padding:2px 0 2px 14px;}
  .formula .lbl{color:var(--hil-text-muted);}
  .formula .num{color:var(--solar);}

  /* Breadcrumb + active-member strip — module-specific nav context, not
     something hil-shell.js provides itself. The old hand-rolled fake header
     and fake "Patch: calm" status dot are gone — the real header and real
     PATCH bubble now come from HILShell.init() below. */
  .gms-topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--hil-surface-2);border-bottom:1px solid var(--hil-border);flex-wrap:wrap;}
  .gms-crumb{font-family:var(--font-mono);font-size:11px;color:var(--hil-text-muted);}
  .gms-crumb b{color:var(--hil-green);}
  .gms-member{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--hil-text-muted);}
  .gms-member .name{color:var(--hil-text);font-weight:700;}
  .gms-member .pill{background:var(--hil-surface);border:1px solid var(--hil-border);border-radius:10px;padding:3px 10px;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;}

  .wrapup-panel{text-align:center;}
  .btn-wrapup{font-family:var(--font-display);font-size:12px;letter-spacing:0.05em;background:var(--hil-green);color:#04140a;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-weight:700;}
  .btn-wrapup:hover{background:#00e673;}
  .btn-wrapup:disabled{background:var(--hil-border-lt);color:var(--hil-text-muted);cursor:default;}
  .ledger-panel{border:1px solid var(--hil-border);border-radius:8px;background:var(--hil-surface);margin-top:14px;}
  .ledger-header{padding:10px 16px;background:var(--hil-surface-2);border-bottom:1px solid var(--hil-border);font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .ledger-pre{margin:0;padding:16px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--hil-green);overflow-x:auto;}
  .ledger-pre .k{color:var(--blue,#38bdf8);} .ledger-pre .s{color:var(--hil-amber);}
</style>
</head>
<body>

  <div class="gms-topbar">
    <div class="gms-crumb">Guild &nbsp;&rsaquo;&nbsp; Electric Forge &nbsp;&rsaquo;&nbsp; <b>Solar &amp; Battery Lab</b></div>
    <div class="gms-member">
      <span class="name" id="memberName">—</span>
      <span class="pill" id="memberPill">resolving member…</span>
    </div>
  </div>

<div class="wrap">

  <header class="moduleheader">
    <h1>SOLAR <span>&amp;</span> BATTERY LAB</h1>
    <div class="subtitle">Ah, Wh, C-rate, and whether your panel can actually keep up with your load</div>
  </header>

  <div class="stage">
    <canvas id="canvas" width="1000" height="260"></canvas>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label>Battery capacity <b id="capVal">100 Ah</b></label>
        <input type="range" id="capacity" min="20" max="400" value="100" step="5">
      </div>
      <div class="field">
        <label>System voltage</label>
        <div class="presets" id="voltPresets">
          <button data-v="12">12V</button>
          <button data-v="24" class="active">24V</button>
          <button data-v="48">48V</button>
        </div>
      </div>
      <div class="field">
        <label>Current charge <b id="socVal">50%</b></label>
        <input type="range" id="soc" min="0" max="100" value="50" step="1">
      </div>
      <div class="field">
        <label>Load (device draw) <b id="loadVal">300 W</b></label>
        <input type="range" id="load" min="0" max="3000" value="300" step="10">
      </div>
      <div class="field">
        <label>Solar array rating <b id="panelVal">400 W</b></label>
        <input type="range" id="panel" min="0" max="2000" value="400" step="10">
      </div>
      <div class="field">
        <label>Sun conditions <b id="sunVal">80%</b></label>
        <input type="range" id="sun" min="0" max="100" value="80" step="5">
      </div>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>Charge controller</label>
      <div class="togglegroup" id="controllerToggle">
        <button data-c="mppt" class="active">MPPT (~97%)</button>
        <button data-c="pwm">PWM (~80%)</button>
      </div>
    </div>

    <div class="battbar">
      <div class="battfill" id="battFill"></div>
      <div class="battlabel" id="battLabel"></div>
    </div>

    <div class="summary">
      <div class="scard"><div class="lbl">Solar output (actual)</div><div class="val" id="solarOut" style="color:var(--solar);"></div></div>
      <div class="scard"><div class="lbl">Net power flow</div><div class="val" id="netFlow"></div></div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="formula" id="formulaBox"></div>
  </div>

  <div class="panel wrapup-panel">
    <button class="btn-wrapup" id="wrapUpBtn">Wrap Up &rarr;</button>
  </div>

  <div class="ledger-panel">
    <div class="ledger-header">Session Log Entry — what this Wrap Up wrote to the Ledger</div>
    <pre class="ledger-pre" id="ledgerPreview">— click Wrap Up to log this session —</pre>
  </div>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let capacity = 100, voltage = 24, soc = 50, load = 300, panel = 400, sun = 80, controller = 'mppt';

const capInput = document.getElementById('capacity');
const capVal = document.getElementById('capVal');
const voltPresets = document.getElementById('voltPresets');
const socInput = document.getElementById('soc');
const socVal = document.getElementById('socVal');
const loadInput = document.getElementById('load');
const loadVal = document.getElementById('loadVal');
const panelInput = document.getElementById('panel');
const panelVal = document.getElementById('panelVal');
const sunInput = document.getElementById('sun');
const sunVal = document.getElementById('sunVal');
const controllerToggle = document.getElementById('controllerToggle');
const battFill = document.getElementById('battFill');
const battLabel = document.getElementById('battLabel');
const solarOut = document.getElementById('solarOut');
const netFlow = document.getElementById('netFlow');
const statusBox = document.getElementById('statusBox');
const formulaBox = document.getElementById('formulaBox');

const CTRL_EFF = { mppt: 0.97, pwm: 0.80 };
const MAX_SAFE_C = 1.0; // typical LiFePO4 continuous limit, for teaching purposes

function compute(){
  const Wh = capacity * voltage;
  const eff = CTRL_EFF[controller];
  const solarActual = panel * (sun/100) * eff;
  const net = solarActual - load;
  const Inet = net / voltage;
  const cRate = Math.abs(Inet) / capacity;

  solarOut.textContent = solarActual.toFixed(0) + ' W';
  netFlow.textContent = (net>=0?'+':'') + net.toFixed(0) + ' W';
  netFlow.style.color = net >= 0 ? 'var(--batt)' : 'var(--hil-danger)';

  // battery bar
  battFill.style.width = soc + '%';
  battFill.style.background = soc > 50 ? 'var(--batt)' : soc > 20 ? 'var(--hil-amber)' : 'var(--hil-danger)';
  battLabel.textContent = soc + '% · ' + Wh.toFixed(0) + ' Wh capacity';

  let statusCls, statusHtml;
  if(cRate > MAX_SAFE_C){
    statusCls = 'bad';
    const verb = net>=0 ? 'charging' : 'discharging';
    statusHtml = `⚠ ${(cRate).toFixed(2)}C — ${verb} faster than the typical safe continuous rate (${MAX_SAFE_C}C) for this battery size. <span class="sub">At ${capacity}Ah, that's a safe limit of ~${(capacity*MAX_SAFE_C).toFixed(0)}A — this system is asking for ${Math.abs(Inet).toFixed(1)}A.</span>`;
  } else if(net > 0){
    const remainingWh = Wh * (1 - soc/100);
    const hoursToFull = remainingWh / net;
    statusCls = 'good';
    statusHtml = `Charging — full in about <b>${hoursToFull.toFixed(1)} hours</b> at this rate. <span class="sub">${cRate.toFixed(2)}C charge rate — within the safe range.</span>`;
  } else if(net < 0){
    const remainingWh = Wh * (soc/100);
    const hoursToEmpty = remainingWh / Math.abs(net);
    statusCls = soc < 20 ? 'warn' : 'good';
    statusHtml = `Discharging — empty in about <b>${hoursToEmpty.toFixed(1)} hours</b> at this load. <span class="sub">${cRate.toFixed(2)}C discharge rate.</span>`;
  } else {
    statusCls = 'good';
    statusHtml = `Holding steady — solar output exactly matches the load right now.`;
  }
  statusBox.className = 'status ' + statusCls;
  statusBox.innerHTML = statusHtml;

  formulaBox.innerHTML = `<span class="lbl">Capacity:</span> Wh = Ah × V = ${capacity} × ${voltage} = <span class="num">${Wh.toFixed(0)}Wh</span>
    &nbsp; <span class="lbl">Solar actual:</span> rated × sun% × controller eff = ${panel} × ${sun}% × ${(eff*100).toFixed(0)}% = <span class="num">${solarActual.toFixed(0)}W</span>
    <br><span class="lbl">Net:</span> solar − load = ${solarActual.toFixed(0)} − ${load} = <span class="num">${net.toFixed(0)}W</span>
    &nbsp; <span class="lbl">C-rate:</span> |I| / Ah = ${Math.abs(Inet).toFixed(1)} / ${capacity} = <span class="num">${cRate.toFixed(2)}C</span>`;

  draw(solarActual, net);
}

function draw(solarActual, net){
  ctx.fillStyle = '#0a0c0b'; ctx.fillRect(0,0,W,H);
  const midY = 130;

  // Panel icon (left)
  ctx.strokeStyle = '#ff9f5a'; ctx.fillStyle = 'rgba(255,159,90,0.15)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.rect(60,70,120,80); ctx.fill(); ctx.stroke();
  for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(60+i*30,70); ctx.lineTo(60+i*30,150); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(60,110); ctx.lineTo(180,110); ctx.stroke();
  ctx.fillStyle = '#6b7d72'; ctx.font='12px var(--font-mono)'; ctx.textAlign='center';
  ctx.fillText('SOLAR ARRAY', 120, 168);
  ctx.fillStyle = '#ff9f5a';
  ctx.fillText(solarActual.toFixed(0)+'W', 120, 60);

  // Controller box (middle)
  ctx.strokeStyle = '#3a453e'; ctx.fillStyle = '#1c201e';
  ctx.beginPath(); ctx.rect(420,90,140,60); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6b7d72';
  ctx.fillText('CHARGE', 490, 115);
  ctx.fillText('CONTROLLER', 490, 130);

  // Battery box (right)
  ctx.strokeStyle = '#5fd68a'; ctx.fillStyle = 'rgba(95,214,138,0.12)';
  ctx.beginPath(); ctx.rect(780,70,160,80); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.rect(940,90,10,40); ctx.fill();
  ctx.fillStyle = '#6b7d72';
  ctx.fillText('BATTERY', 860, 168);
  ctx.fillText(voltage+'V / '+capacity+'Ah', 860, 60);

  // Load icon (bottom right)
  ctx.strokeStyle = '#3a453e';
  ctx.beginPath(); ctx.arc(860,220,22,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(848,220); ctx.lineTo(872,220); ctx.moveTo(860,208); ctx.lineTo(860,232); ctx.stroke();
  ctx.fillStyle = '#6b7d72';
  ctx.fillText('LOAD', 860, 250);

  // wires + flow arrows
  ctx.strokeStyle = '#3a453e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(180,110); ctx.lineTo(420,110);
  ctx.moveTo(560,110); ctx.lineTo(780,110);
  ctx.moveTo(860,150); ctx.lineTo(860,198);
  ctx.stroke();

  ctx.fillStyle = net >= 0 ? '#5fd68a' : '#cc3333';
  ctx.font = '13px var(--font-mono)';
  ctx.fillText((net>=0?'→ charging':'← discharging'), 670, 95);
  ctx.textAlign = 'left';
}

capInput.addEventListener('input',()=>{ capacity=parseFloat(capInput.value); capVal.textContent=capacity+' Ah'; compute(); });
voltPresets.addEventListener('click',(e)=>{
  const btn=e.target.closest('button'); if(!btn) return;
  voltage=parseFloat(btn.dataset.v);
  [...voltPresets.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  compute();
});
socInput.addEventListener('input',()=>{ soc=parseFloat(socInput.value); socVal.textContent=soc+'%'; compute(); });
loadInput.addEventListener('input',()=>{ load=parseFloat(loadInput.value); loadVal.textContent=load+' W'; compute(); });
panelInput.addEventListener('input',()=>{ panel=parseFloat(panelInput.value); panelVal.textContent=panel+' W'; compute(); });
sunInput.addEventListener('input',()=>{ sun=parseFloat(sunInput.value); sunVal.textContent=sun+'%'; compute(); });
controllerToggle.addEventListener('click',(e)=>{
  const btn=e.target.closest('button'); if(!btn) return;
  controller=btn.dataset.c;
  [...controllerToggle.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  compute();
});

compute();
</script>

<script type="module">
  import { SessionLogger, resolveActiveMember, writeSessionLogEntry } from '../session-logger.js';

  // ─── MODULE MANIFEST (HIL-Guild-Module-Logging-Standard-v3.md, Part 4) ─────
  // scoringPath "none" — matches the Universal Scoring Spec's mapping table
  // ("Wrap Up + heartbeat only, no score") and the live code's own hardcoded
  // outcome:"explored". Not touching that call — it was already correct.
  // conceptTags note: this module doesn't appear at all in the Concept Index
  // example (Part 6), not just missing a tag — flagging that the Index needs
  // a solar-battery-lab entry added, same "compiled, not hand-maintained"
  // gap noted in Wire Lab's manifest.
  const MODULE_MANIFEST = {
    moduleId:    'solar-battery-lab',
    subjects:    ['physics', 'engineering'],
    conceptTags: ['wh-capacity', 'c-rate', 'charge-controller-efficiency'],
    ageRange:    null,
    timeModel:   'active_session',
    scoringPath: 'none',
  };

  const logger = new SessionLogger(MODULE_MANIFEST);
  const wrapUpBtn = document.getElementById('wrapUpBtn');
  const ledgerPreview = document.getElementById('ledgerPreview');
  const memberNameEl = document.getElementById('memberName');
  const memberPillEl = document.getElementById('memberPill');

  let activeMember = null;

  // KNOWN OPEN ITEM (same one flagged in every Electric Forge module so
  // far): hil-guild.html's module cards don't pass a ?member= param, so a
  // standalone launch has no way to know which household member is active.
  // Falling back to the same auto-select hil-guild-scores.html uses.
  async function resolveMember(user) {
    activeMember = await resolveActiveMember(window.db, user.uid);
    if (activeMember) {
      memberNameEl.textContent = activeMember.name || 'Unnamed member';
      memberPillEl.textContent = 'auto-selected';
    } else {
      memberNameEl.textContent = 'No member set up';
      memberPillEl.textContent = 'add a member in Guild';
    }
  }

  HILShell.init({
    toolId: 'solar-battery-lab',
    toolName: 'Solar & Battery Lab',
    requireAuth: true,
    onAuth: async (user) => {
      if (!user) return;
      await resolveMember(user);
      logger.start(); // module is interactive as soon as auth + member resolve
    }
  });

  logger.onWrapUp = async (entry) => {
    if (!window.currentUser || !activeMember) {
      HILShell.toast('Sign in (and make sure a household member exists) to save this session', 'error');
      return;
    }
    try {
      await writeSessionLogEntry(window.db, window.currentUser.uid, activeMember.id, entry);
      HILShell.toast('Session logged to the Ledger', 'success');
    } catch (err) {
      console.error('Solar & Battery Lab: session log write failed', err);
      HILShell.toast('Could not save this session — try again', 'error');
    }
  };

  function renderLedgerPreview(entry) {
    const json = JSON.stringify(entry, null, 2)
      .replace(/"(entryId|moduleId|entryType|timestampStart|timestampEnd|activeMinutes|subjectsTagged|conceptTags|outcome|accuracy|verifiedBy|tier|description|auto_flushed)":/g, '<span class="k">"$1"</span>:')
      .replace(/: "([^"]+)"/g, ': <span class="s">"$1"</span>');
    ledgerPreview.innerHTML = json;
  }

  wrapUpBtn.addEventListener('click', async () => {
    wrapUpBtn.disabled = true; // session-scoped duplicate guard (Part 3)
    const entry = await logger.wrapUp({
      // no outcome passed — scoringPath "none" means SessionLogger sets
      // outcome to "explored" itself, per Part 5's controlled vocabulary.
      description: `Modeled a ${capacity}Ah/${voltage}V system with a ${panel}W array against a ${load}W load.`,
    });
    if (entry) {
      renderLedgerPreview(entry);
    } else {
      wrapUpBtn.disabled = false; // wrapUp() returned null (already wrapped / not started) — nothing changed
    }
  });
</script>
</body>
</html>
